<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>السندات - المحاسب الاحترافي بلس</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}

body{
  background:#f5f7fa;
  color:#172033;
  min-height:100vh;
}

.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#f5f7fa;
}

/* Header */
.header{
  background:linear-gradient(135deg,#1556c0,#17439a);
  color:#fff;
  padding:18px 16px 22px;
  border-radius:0 0 22px 22px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.header-title{
  flex:1;
}

.header-title h1{
  font-size:19px;
  font-weight:800;
}

.header-title p{
  margin-top:4px;
  font-size:12px;
  opacity:.82;
}

.header-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

/* Tabs */
.tabs{
  display:flex;
  gap:8px;
  padding:12px;
  margin-top:-4px;
}

.tab{
  flex:1;
  border:1px solid #dfe5ef;
  background:#fff;
  color:#596579;
  padding:12px 8px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#1556c0;
  border-color:#1556c0;
  color:#fff;
}

/* Content */
.content{
  padding:4px 12px 115px;
}

.section{
  background:#fff;
  border:1px solid #e5eaf1;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.section-title{
  font-size:14px;
  font-weight:800;
  color:#1c2d4f;
  margin-bottom:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:11px;
  color:#69758a;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #dfe5ee;
  background:#fbfcfe;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  color:#172033;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1556c0;
  background:#fff;
}

textarea{
  min-height:88px;
  resize:vertical;
}

/* Account */
.account-box{
  display:flex;
  gap:8px;
}

.account-box button{
  width:46px;
  border:0;
  border-radius:11px;
  background:#1556c0;
  color:#fff;
  font-size:20px;
}

.account-select{
  flex:1;
  text-align:right;
  background:#fbfcfe;
  border:1px solid #dfe5ee;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  color:#596579;
  cursor:pointer;
}

/* Amount */
.amount-box{
  display:grid;
  grid-template-columns:1fr 120px;
  gap:10px;
}

.amount{
  font-size:21px;
  font-weight:800;
  color:#1556c0;
}

/* Attachment */
.attach{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px dashed #cbd5e5;
  padding:12px;
  border-radius:11px;
  cursor:pointer;
  color:#596579;
  font-size:13px;
}

.attach input{
  display:none;
}

/* Total */
.total{
  background:linear-gradient(135deg,#eef5ff,#f8fbff);
  border:1px solid #d5e4ff;
  border-radius:16px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total span{
  color:#64748b;
  font-size:13px;
}

.total strong{
  color:#1556c0;
  font-size:24px;
}

/* Bottom actions */
.actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  border-top:1px solid #e3e8ef;
  padding:10px;
  backdrop-filter:blur(10px);
}

.actions-inner{
  max-width:720px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:8px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 8px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:#1556c0;
  color:#fff;
}

.btn-secondary{
  background:#eef3fb;
  color:#1556c0;
}

.btn-light{
  background:#f5f6f8;
  color:#475569;
}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(15,23,42,.55);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:720px;
  max-height:82vh;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:16px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.modal-head strong{
  font-size:16px;
}

.close{
  border:0;
  background:#f1f4f8;
  width:38px;
  height:38px;
  border-radius:10px;
  font-size:18px;
}

.search{
  margin-bottom:10px;
}

.account-list{
  max-height:55vh;
  overflow:auto;
}

.account-item{
  padding:13px 10px;
  border-bottom:1px solid #eef1f5;
  cursor:pointer;
}

.account-item strong{
  display:block;
  font-size:14px;
}

.account-item small{
  color:#7b8798;
}

/* Status */
.status{
  margin-top:4px;
  padding:9px 12px;
  border-radius:10px;
  background:#edf7ee;
  color:#28743a;
  font-size:12px;
  text-align:center;
}

/* Desktop */
@media(min-width:700px){
  .actions{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:100%;
    max-width:720px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-top">

      <button class="back" onclick="goBack()">‹</button>

      <div class="header-title">
        <h1>إضافة سند</h1>
        <p>المحاسب الاحترافي بلس</p>
      </div>

      <div class="header-icon">▣</div>

    </div>
  </header>

  <div class="tabs">

    <button
      class="tab active"
      id="tabReceipt"
      onclick="setVoucherType('قبض')">
      سند قبض
    </button>

    <button
      class="tab"
      id="tabPayment"
      onclick="setVoucherType('صرف')">
      سند صرف
    </button>

    <button
      class="tab"
      id="tabReturn"
      onclick="showReturnNotice()">
      مرتجع
    </button>

  </div>

  <main class="content">

    <!-- معلومات السند -->
    <section class="section">

      <div class="section-title">معلومات السند</div>

      <div class="grid">

        <div class="field">
          <label>رقم السند</label>
          <input id="voucherNo" readonly>
        </div>

        <div class="field">
          <label>التاريخ</label>
          <input id="voucherDate" type="date">
        </div>

        <div class="field full">
          <label>نوع السند</label>
          <input id="voucherType" value="قبض" readonly>
        </div>

      </div>

    </section>

    <!-- الحساب -->
    <section class="section">

      <div class="section-title">الحساب والطرف</div>

      <div class="field">

        <label>العميل / المورد</label>

        <div class="account-box">

          <button onclick="openAccountsModal()">+</button>

          <button
            class="account-select"
            id="accDisplayBtn"
            onclick="openAccountsModal()">
            اضغط لاختيار العميل أو المورد
          </button>

        </div>

      </div>

    </section>

    <!-- الدفع -->
    <section class="section">

      <div class="section-title">بيانات الدفع</div>

      <div class="grid">

        <div class="field">
          <label>طريقة الدفع</label>

          <select id="paymentMethod">
            <option value="cash">نقدي</option>
            <option value="bank">حساب بنكي</option>
            <option value="transfer">تحويل</option>
            <option value="other">أخرى</option>
          </select>

        </div>

        <div class="field">
          <label>الصندوق / الحساب</label>

          <select id="fundBox">
            <option value="الصندوق الرئيسي">الصندوق الرئيسي</option>
            <option value="البنك">البنك</option>
          </select>

        </div>

      </div>

    </section>

    <!-- المبلغ -->
    <section class="section">

      <div class="section-title">المبلغ والعملة</div>

      <div class="amount-box">

        <div class="field">
          <label>المبلغ</label>

          <input
            id="voucherAmount"
            class="amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            oninput="updateTotal()">

        </div>

        <div class="field">
          <label>العملة</label>

          <select id="voucherCurrency">
            <option value="ريال يمني">ريال يمني</option>
            <option value="دولار">دولار</option>
            <option value="سعودي">ريال سعودي</option>
          </select>

        </div>

      </div>

    </section>

    <!-- البيان -->
    <section class="section">

      <div class="section-title">البيان والمرفقات</div>

      <div class="field">

        <label>البيان</label>

        <textarea
          id="voucherNotes"
          placeholder="اكتب بيان السند أو الملاحظات..."></textarea>

      </div>

      <br>

      <label class="attach">
        <span>📎 إضافة مرفق أو صورة</span>
        <input id="receiptImage" type="file" accept="image/*,.pdf">
      </label>

    </section>

    <!-- الإجمالي -->
    <section class="section">

      <div class="total">

        <span>إجمالي السند</span>

        <strong>
          <span id="totalAmount">0.00</span>
        </strong>

      </div>

      <div class="status">
        جاهز للحفظ
      </div>

    </section>

  </main>

</div>

<!-- أزرار أسفل الشاشة -->
<div class="actions">

  <div class="actions-inner">

    <button
      class="btn btn-primary"
      onclick="saveVoucherTransaction(false)">
      حفظ السند
    </button>

    <button
      class="btn btn-secondary"
      onclick="saveAndPrint()">
      حفظ وطباعة
    </button>

    <button
      class="btn btn-light"
      onclick="clearVoucher()">
      حفظ ومسح جديد
    </button>

  </div>

</div>

<!-- اختيار الحساب -->
<div class="modal" id="accountsModal">

  <div class="modal-box">

    <div class="modal-head">

      <strong>اختيار العميل أو المورد</strong>

      <button
        class="close"
        onclick="closeAccountsModal()">
        ×
      </button>

    </div>

    <input
      class="search"
      id="accountSearch"
      placeholder="بحث عن حساب..."
      oninput="filterAccounts()">

    <div
      class="account-list"
      id="accountsList">
    </div>

  </div>

</div>

<script>
const VOUCHER_KEY = 'hisabak_vouchers';
const LEDGER_KEY = 'hisabak_ledger';

let selectedAccount = null;
let accountsCache = [];

function $(id){
  return document.getElementById(id);
}

function today(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function init(){

  $('voucherDate').value = today();

  $('voucherNo').value =
    'V-' + Date.now().toString().slice(-8);

  fetchAllAccounts();

  updateTotal();
}

function setVoucherType(type){

  $('voucherType').value = type;

  $('tabReceipt').classList.toggle(
    'active',
    type === 'قبض'
  );

  $('tabPayment').classList.toggle(
    'active',
    type === 'صرف'
  );
}

function showReturnNotice(){
  alert('قسم المرتجعات سيتم ربطه بواجهة الفواتير والمرتجعات في الخطوة القادمة.');
}

function updateTotal(){

  const amount =
    Number($('voucherAmount').value || 0);

  $('totalAmount').textContent =
    amount.toLocaleString('en-US',{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
}

function fetchAllAccounts(){

  accountsCache = [];

  const customers =
    JSON.parse(
      localStorage.getItem('hisabak_customers') || '[]'
    );

  const suppliers =
    JSON.parse(
      localStorage.getItem('hisabak_suppliers') || '[]'
    );

  customers.forEach(item => {

    accountsCache.push({
      id:item.id || item.customerId || ('c_'+Math.random()),
      name:item.name || item.customerName || 'عميل',
      type:'عميل'
    });

  });

  suppliers.forEach(item => {

    accountsCache.push({
      id:item.id || item.supplierId || ('s_'+Math.random()),
      name:item.name || item.supplierName || 'مورد',
      type:'مورد'
    });

  });

  renderAccounts(accountsCache);
}

function renderAccounts(list){

  const box = $('accountsList');

  if(!list.length){

    box.innerHTML =
      '<div style="padding:25px;text-align:center;color:#7b8798">لا توجد حسابات</div>';

    return;
  }

  box.innerHTML = list.map(account => `

    <div
      class="account-item"
      onclick="chooseAccount('${escapeHtml(account.id)}')">

      <strong>${escapeHtml(account.name)}</strong>

      <small>${escapeHtml(account.type)}</small>

    </div>

  `).join('');
}

function escapeHtml(value){

  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function openAccountsModal(){

  fetchAllAccounts();

  $('accountSearch').value = '';

  $('accountsModal').classList.add('show');
}

function closeAccountsModal(){

  $('accountsModal').classList.remove('show');
}

function filterAccounts(){

  const q =
    $('accountSearch').value.trim().toLowerCase();

  const filtered =
    accountsCache.filter(account =>
      String(account.name)
        .toLowerCase()
        .includes(q)
    );

  renderAccounts(filtered);
}

function chooseAccount(id){

  const account =
    accountsCache.find(item =>
      String(item.id) === String(id)
    );

  if(!account) return;

  selectedAccount = account;

  $('accDisplayBtn').textContent =
    account.name + ' — ' + account.type;

  closeAccountsModal();
}

function saveVoucherTransaction(clearAfter){

  const amount =
    Number($('voucherAmount').value || 0);

  if(amount <= 0){

    alert('أدخل مبلغ السند أولاً');
    return;
  }

  if(!selectedAccount){

    alert('اختر العميل أو المورد أولاً');
    return;
  }

  const voucher = {

    id:
      'v_' +
      Date.now(),

    voucherNo:
      $('voucherNo').value,

    date:
      $('voucherDate').value,

    type:
      $('voucherType').value,

    accountId:
      selectedAccount.id,

    accountName:
      selectedAccount.name,

    accountType:
      selectedAccount.type,

    paymentMethod:
      $('paymentMethod').value,

    fund:
      $('fundBox').value,

    currency:
      $('voucherCurrency').value,

    amount:
      amount,

    notes:
      $('voucherNotes').value.trim(),

    createdAt:
      new Date().toISOString()

  };

  const vouchers =
    JSON.parse(
      localStorage.getItem(VOUCHER_KEY) || '[]'
    );

  vouchers.push(voucher);

  localStorage.setItem(
    VOUCHER_KEY,
    JSON.stringify(vouchers)
  );

  /*
   * السجل القديم محفوظ للتوافق.
   * الربط المحاسبي المزدوج مع core/accounting.js
   * سيكون في مرحلة ربط المحرك المحاسبي.
   */
  const ledger =
    JSON.parse(
      localStorage.getItem(LEDGER_KEY) || '[]'
    );

  ledger.push({

    id:
      'l_' +
      Date.now(),

    date:
      voucher.date,

    voucherId:
      voucher.id,

    type:
      voucher.type,

    accountId:
      voucher.accountId,

    accountName:
      voucher.accountName,

    debit:
      voucher.type === 'صرف'
        ? amount
        : 0,

    credit:
      voucher.type === 'قبض'
        ? amount
        : 0,

    currency:
      voucher.currency,

    description:
      voucher.notes || 'سند ' + voucher.type

  });

  localStorage.setItem(
    LEDGER_KEY,
    JSON.stringify(ledger)
  );

  alert(
    'تم حفظ سند ' +
    voucher.type +
    ' بنجاح'
  );

  if(clearAfter){

    clearForm();

  }

}

function saveAndPrint(){

  saveVoucherTransaction(false);

  setTimeout(() => {
    window.print();
  },300);

}

function clearVoucher(){

  saveVoucherTransaction(true);

}

function clearForm(){

  $('voucherAmount').value = '';

  $('voucherNotes').value = '';

  $('receiptImage').value = '';

  selectedAccount = null;

  $('accDisplayBtn').textContent =
    'اضغط لاختيار العميل أو المورد';

  $('voucherNo').value =
    'V-' + Date.now().toString().slice(-8);

  updateTotal();

}

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    window.location.href = 'index.html';

  }

}

init();
</script>

</body>
</html>
