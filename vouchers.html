<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اضافة سند صرف/قبض - المحاسب الإحترافي بلس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0277bd; --accent-pink: #d81b60; --accent-green: #2e7d32; --bg: #f4f6f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; touch-action: manipulation; }
        body { background: var(--bg); padding: 12px; color: #263238; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h2 { font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .header label { font-size: 12px; color: var(--accent-pink); font-weight: bold; }

        .status-badge { background: #0277bd; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }

        .row-box { background: #fff; border: 1px solid #b0bec5; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; }
        .row-box input, .row-box select { flex: 1; border: none; padding: 12px; font-size: 14px; text-align: center; outline: none; background: transparent; }
        .btn-side { padding: 12px 16px; background: #eceff1; border: none; border-left: 1px solid #b0bec5; color: #455a64; font-size: 16px; cursor: pointer; }

        .account-btn-trigger {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            background: #fff;
            border: none;
            cursor: pointer;
        }

        .balance-card { background: #e1f5fe; border: 1px solid #81d4fa; border-radius: 8px; padding: 10px; text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 15px; }

        .radio-grp { display: flex; justify-content: center; gap: 30px; margin: 15px 0; font-size: 16px; font-weight: bold; }
        .radio-grp label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

        .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .btn { border: none; padding: 12px 4px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
        .btn-save { background: #0277bd; }
        .btn-send { background: #2e7d32; }
        .btn-photo { background: #37474f; }
        .btn-close { background: #d81b60; }

        /* نافذة اختيار الحساب المنبثقة للجوال */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 10000;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px 16px 0 0;
            padding: 16px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-search {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #90caf9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            text-align: right;
        }
        .account-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
        }
        .acc-card {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            cursor: pointer;
        }
        .acc-card:active { background: #e1f5fe; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fa-solid fa-arrow-right" onclick="history.back()"></i> اضافة سند صرف/قبض</h2>
        <label><input type="checkbox" id="closeOnSave" checked> الإغلاق بعد الحفظ</label>
    </div>

    <div>
        <span class="status-badge">جاهز للعمليات</span>
    </div>

    <!-- حقل اختيار الحساب المستقر -->
    <div class="row-box">
        <button class="btn-side" type="button" onclick="quickCreateAccount()" title="إضافة حساب جديد"><i class="fa-solid fa-plus"></i></button>
        <button type="button" class="account-btn-trigger" id="accDisplayBtn" onclick="openAccountsModal()">
            اضغط هنا لاختيار العميل أو المورد ▾
        </button>
    </div>

    <div class="balance-card" id="balanceDisplay">0.00 الرصيد الحالي</div>

    <!-- المبلغ والعملة -->
    <div class="row-box">
        <input type="number" id="voucherAmount" placeholder="المبلغ" step="any" required>
        <select id="voucherCurrency" style="border-right: 1px solid #b0bec5;">
            <option value="ريال سعودي">ريال سعودي</option>
            <option value="ريال يمني">ريال يمني</option>
            <option value="دولار">دولار</option>
        </select>
    </div>

    <!-- التفاصيل وإرفاق الصورة -->
    <div class="row-box">
        <button class="btn-side" type="button" onclick="document.getElementById('receiptImage').click()"><i class="fa-solid fa-camera"></i>+</button>
        <input type="text" id="voucherNotes" placeholder="التفاصيل / البيان">
        <input type="file" id="receiptImage" accept="image/*" style="display:none;" onchange="alert('تم إرفاق الصورة بنجاح')">
    </div>

    <!-- الصندوق -->
    <div class="row-box">
        <input type="text" value="حساب الصندوق" readonly style="color:#777;">
        <select id="fundBox" style="border-right: 1px solid #b0bec5;">
            <option>الصندوق الرئيسي</option>
            <option>صندوق الفرع</option>
        </select>
    </div>

    <!-- نوع السند -->
    <div class="radio-grp">
        <label style="color:#d81b60;"><input type="radio" name="vType" value="صرف" checked> صرف</label>
        <label style="color:#0277bd;"><input type="radio" name="vType" value="قبض"> قبض</label>
    </div>

    <!-- أزرار الإجراءات -->
    <div class="action-btns">
        <button type="button" class="btn btn-save" onclick="saveVoucherTransaction()">حفظ</button>
        <button type="button" class="btn btn-send" onclick="shareVoucherWhatsApp()">ارسال</button>
        <button type="button" class="btn btn-photo" onclick="document.getElementById('receiptImage').click()">صوره</button>
        <button type="button" class="btn btn-close" onclick="location.href='suppliers.html'">اغلاق</button>
    </div>

    <!-- النافذة المنبثقة لاختيار الحساب -->
    <div class="modal-overlay" id="accountsModal">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="font-size:16px;">اختر العميل أو المورد</strong>
                <button type="button" onclick="closeAccountsModal()" style="border:none; background:none; font-size:18px; color:#888;">✕</button>
            </div>
            <input type="text" id="searchFilter" class="modal-search" placeholder="بحث بالاسم أو الهاتف..." oninput="filterModalAccounts()">
            <div class="account-list" id="modalAccountsList"></div>
            <button type="button" class="btn btn-save" style="width:100%;" onclick="quickCreateAccount()">+ إضافة مورد/عميل جديد</button>
        </div>
    </div>

    <script>
        // مزامنة الحسابات والتأكد من وجود المورد العكبار
        function fetchAllAccounts() {
            let sups = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let custs = JSON.parse(localStorage.getItem('hisabak_customers') || '[]');

            let hasAkbar = sups.some(s => s.name && s.name.includes('العكبار'));
            if (!hasAkbar) {
                let akbar = {
                    id: 'sup_akbar_101',
                    name: 'المورد العكبار',
                    phone: '',
                    openingBalance: 0,
                    balType: 'credit'
                };
                sups.push(akbar);
                localStorage.setItem('hisabak_suppliers', JSON.stringify(sups));
            }

            let all = [];
            sups.forEach(s => all.push({ ...s, roleType: 'مورد' }));
            custs.forEach(c => all.push({ ...c, roleType: 'عميل' }));
            return all;
        }

        let selectedAccount = null;

        function openAccountsModal() {
            document.getElementById('accountsModal').style.display = 'flex';
            document.getElementById('searchFilter').value = '';
            filterModalAccounts();
        }

        function closeAccountsModal() {
            document.getElementById('accountsModal').style.display = 'none';
        }

        function filterModalAccounts() {
            let q = document.getElementById('searchFilter').value.trim().toLowerCase();
            let list = fetchAllAccounts();
            let container = document.getElementById('modalAccountsList');
            container.innerHTML = '';

            let filtered = list.filter(a => !q || (a.name && a.name.toLowerCase().includes(q)) || (a.phone && a.phone.includes(q)));

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; color:#777;">لا يوجد حساب بهذا الاسم</div>';
                return;
            }

            filtered.forEach(acc => {
                let card = document.createElement('div');
                card.className = 'acc-card';
                let b = parseFloat(acc.openingBalance) || 0;
                let t = acc.balType === 'credit' ? 'له' : 'عليه';
                card.innerHTML = `
                    <div>
                        <div style="font-weight:bold; font-size:14px;">${acc.name}</div>
                        <span style="font-size:11px; background:#e0e0e0; padding:2px 6px; border-radius:4px;">${acc.roleType}</span>
                    </div>
                    <div style="text-align:left; font-size:13px; font-weight:bold; color:#0277bd;">
                        ${b.toLocaleString()} (${t})
                    </div>
                `;
                card.onclick = function() {
                    chooseAccount(acc);
                };
                container.appendChild(card);
            });
        }

        function chooseAccount(acc) {
            selectedAccount = acc;
            document.getElementById('accDisplayBtn').innerText = acc.name + ' (' + acc.roleType + ')';
            let b = parseFloat(acc.openingBalance) || 0;
            let t = acc.balType === 'credit' ? 'لــه' : 'عليه';
            document.getElementById('balanceDisplay').innerText = b.toLocaleString() + ' الرصيد الحالي (' + t + ')';
            closeAccountsModal();
        }

        function quickCreateAccount() {
            let n = prompt('أدخل اسم المورد أو العميل الجديد:');
            if (!n || !n.trim()) return;

            let sups = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let newObj = {
                id: 'acc_' + Date.now(),
                name: n.trim(),
                phone: '',
                openingBalance: 0,
                balType: 'credit'
            };
            sups.push(newObj);
            localStorage.setItem('hisabak_suppliers', JSON.stringify(sups));
            chooseAccount({ ...newObj, roleType: 'مورد' });
        }

        // حفظ العملية وتحديث رصيد العميل أو المورد فوراً
        function saveVoucherTransaction() {
            if (!selectedAccount) {
                alert('يرجى اختيار المورد أو العميل أولاً');
                openAccountsModal();
                return;
            }

            let amount = parseFloat(document.getElementById('voucherAmount').value);
            if (!amount || amount <= 0) {
                alert('يرجى إدخال مبلغ صحيح');
                return;
            }

            let vType = document.querySelector('input[name="vType"]:checked').value;
            let cur = document.getElementById('voucherCurrency').value;
            let notes = document.getElementById('voucherNotes').value.trim();
            let fund = document.getElementById('fundBox').value;
            let vCode = 'V-' + Date.now().toString().slice(-5);

            // 1. حساب الرصيد الجديد محاسبياً
            let oldBal = parseFloat(selectedAccount.openingBalance) || 0;
            let signedBal = selectedAccount.balType === 'credit' ? oldBal : -oldBal;

            if (vType === 'صرف') {
                signedBal -= amount; // صرفنا له: يقل دائنيه أو تزيد مديونيته
            } else {
                signedBal += amount; // قبضنا منه: يزيد دائنيه أو يسدد ما عليه
            }

            let newBalType = signedBal >= 0 ? 'credit' : 'debit';
            let finalBal = Math.abs(signedBal);

            // 2. تحديث الحساب في جدول الموردين أو العملاء
            let sups = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let custs = JSON.parse(localStorage.getItem('hisabak_customers') || '[]');
            let updated = false;

            sups = sups.map(s => {
                if (s.name === selectedAccount.name || (s.id && s.id === selectedAccount.id)) {
                    updated = true;
                    return { ...s, openingBalance: finalBal, balType: newBalType };
                }
                return s;
            });

            if (updated) {
                localStorage.setItem('hisabak_suppliers', JSON.stringify(sups));
            } else {
                custs = custs.map(c => {
                    if (c.name === selectedAccount.name || (c.id && c.id === selectedAccount.id)) {
                        return { ...c, openingBalance: finalBal, balType: newBalType };
                    }
                    return c;
                });
                localStorage.setItem('hisabak_customers', JSON.stringify(custs));
            }

            // 3. حفظ السند في السجلات
            let vouchers = JSON.parse(localStorage.getItem('hisabak_vouchers') || '[]');
            vouchers.push({
                id: vCode,
                accountName: selectedAccount.name,
                type: vType,
                amount: amount,
                currency: cur,
                notes: notes,
                fund: fund,
                balanceAfter: finalBal,
                balType: newBalType,
                date: new Date().toLocaleDateString('ar-EG'),
                time: new Date().toLocaleTimeString('ar-EG')
            });
            localStorage.setItem('hisabak_vouchers', JSON.stringify(vouchers));

            // 4. تسجيل في دفتر الأستاذ (Ledger)
            let ledger = JSON.parse(localStorage.getItem('hisabak_ledger') || '[]');
            ledger.push({
                id: Date.now(),
                voucherCode: vCode,
                accountName: selectedAccount.name,
                type: 'سند ' + vType,
                debit: vType === 'صرف' ? amount : 0,
                credit: vType === 'قبض' ? amount : 0,
                balance: finalBal,
                balType: newBalType,
                date: new Date().toLocaleDateString('ar-EG')
            });
            localStorage.setItem('hisabak_ledger', JSON.stringify(ledger));

            alert(`تم حفظ سند ال${vType} برقم (${vCode}) وتحديث رصيد [${selectedAccount.name}] إلى ${finalBal.toLocaleString()} (${newBalType === 'credit' ? 'له' : 'عليه'})`);

            if (document.getElementById('closeOnSave').checked) {
                location.href = 'suppliers.html';
            } else {
                selectedAccount.openingBalance = finalBal;
                selectedAccount.balType = newBalType;
                chooseAccount(selectedAccount);
                document.getElementById('voucherAmount').value = '';
                document.getElementById('voucherNotes').value = '';
            }
        }

        function shareVoucherWhatsApp() {
            if (!selectedAccount) { alert('اختر الحساب أولاً'); return; }
            let amt = document.getElementById('voucherAmount').value;
            if (!amt) { alert('أدخل المبلغ'); return; }
            let vType = document.querySelector('input[name="vType"]:checked').value;
            let cur = document.getElementById('voucherCurrency').value;
            let notes = document.getElementById('voucherNotes').value.trim();

            let msg = `*المحاسب الإحترافي بلس*%0A*سند ${vType}*%0Aالحساب: ${selectedAccount.name}%0Aالمبلغ: ${amt} ${cur}%0Aالبيان: ${notes || 'بدون بيان'}%0Aالتاريخ: ${new Date().toLocaleDateString('ar-EG')}`;
            window.open('https://wa.me/?text=' + msg, '_blank');
        }
    </script>
</body>
</html>
