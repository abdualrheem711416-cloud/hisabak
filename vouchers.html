<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافة سند صرف/قبض - المحاسب الإحترافي بلس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0277bd; --accent-pink: #d81b60; --accent-green: #2e7d32; --bg: #f4f6f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); padding: 14px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h2 { font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .header label { font-size: 12px; color: var(--accent-pink); font-weight: bold; }
        .row-box { background: #fff; border: 1px solid #b0bec5; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; position: relative; }
        .row-box input, .row-box select { flex: 1; border: none; padding: 12px; font-size: 14px; text-align: center; outline: none; background: transparent; }
        .btn-side { padding: 12px 16px; background: #eceff1; border: none; border-left: 1px solid #b0bec5; color: #455a64; font-size: 16px; cursor: pointer; }
        .balance-card { background: #e1f5fe; border: 1px solid #81d4fa; border-radius: 8px; padding: 10px; text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 15px; }
        .radio-grp { display: flex; justify-content: center; gap: 30px; margin: 15px 0; font-size: 16px; font-weight: bold; }
        .radio-grp label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .btn { border: none; padding: 12px 6px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
        .btn-save { background: #0277bd; }
        .btn-send { background: #2e7d32; }
        .btn-photo { background: #37474f; }
        .btn-close { background: #d81b60; }
        .dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 2px solid var(--primary); border-radius: 0 0 8px 8px; max-height: 220px; overflow-y: auto; z-index: 9999; display: none; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .dropdown-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-item:active { background: #e1f5fe; }
    </style>
</head>
<body>
    <div class="header">
        <h2><i class="fa-solid fa-arrow-right" onclick="history.back()"></i> اضافة سند صرف/قبض</h2>
        <label><input type="checkbox" id="closeOnSave" checked> الإغلاق بعد الحفظ</label>
    </div>

    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span style="background:#0277bd; color:#fff; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:bold;">جاهز للعمليات</span>
    </div>

    <div class="row-box">
        <button class="btn-side" onclick="addNewAccount()" title="إضافة حساب"><i class="fa-solid fa-plus"></i></button>
        <input type="text" id="accountName" placeholder="اضغط لاختيار الحساب (مثل العكبار)" readonly onclick="toggleList()">
        <button class="btn-side" style="border-left:none; border-right:1px solid #b0bec5;" onclick="toggleList()"><i class="fa-solid fa-caret-down"></i></button>
        <div class="dropdown" id="accountDropdown"></div>
    </div>

    <div class="balance-card" id="balText">0.00 الرصيد الحالي</div>

    <div class="row-box">
        <input type="number" id="amount" placeholder="المبلغ" step="any">
        <select id="currency" style="border-right:1px solid #b0bec5;">
            <option value="ريال سعودي">ريال سعودي</option>
            <option value="ريال يمني">ريال يمني</option>
            <option value="دولار">دولار</option>
        </select>
    </div>

    <div class="row-box">
        <button class="btn-side" onclick="document.getElementById('imgFile').click()"><i class="fa-solid fa-camera"></i></button>
        <input type="text" id="notes" placeholder="البيان / التفاصيل">
        <input type="file" id="imgFile" accept="image/*" style="display:none;" onchange="alert('تم اختيار الصورة بنجاح')">
    </div>

    <div class="row-box">
        <input type="text" value="حساب الصندوق" readonly style="color:#777;">
        <select id="fund" style="border-right:1px solid #b0bec5;">
            <option>الصندوق الرئيسي</option>
            <option>صندوق الفرع</option>
        </select>
    </div>

    <div class="radio-grp">
        <label style="color:#d81b60;"><input type="radio" name="type" value="صرف" checked> صرف</label>
        <label style="color:#0277bd;"><input type="radio" name="type" value="قبض"> قبض</label>
    </div>

    <div class="action-btns">
        <button class="btn btn-save" onclick="doSave()">حفظ</button>
        <button class="btn btn-send" onclick="doSend()">ارسال</button>
        <button class="btn btn-photo" onclick="document.getElementById('imgFile').click()">صوره</button>
        <button class="btn btn-close" onclick="location.href='index.html'">اغلاق</button>
    </div>

    <script>
        function getAccounts() {
            let s = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let c = JSON.parse(localStorage.getItem('hisabak_customers') || '[]');
            let list = [];
            s.forEach(x => list.push({ ...x, role: 'مورد' }));
            c.forEach(x => list.push({ ...x, role: 'عميل' }));
                let akbar = { id: 'sup_akbar', name: 'المورد العكبار', openingBalance: 0, balType: 'credit', role: 'مورد' };
                s.push(akbar);
                localStorage.setItem('hisabak_suppliers', JSON.stringify(s));
                list.push(akbar);
            }
            return list;
        }

        let curAcc = null;

        function toggleList() {
            let d = document.getElementById('accountDropdown');
            if (d.style.display === 'block') { d.style.display = 'none'; return; }
            d.innerHTML = '';
            let accs = getAccounts();
            accs.forEach(a => {
                let item = document.createElement('div');
                item.className = 'dropdown-item';
                let typeStr = a.balType === 'credit' ? 'له' : 'عليه';
                item.innerHTML = '<div><strong>' + a.name + '</strong> <small style="color:#666;">(' + a.role + ')</small></div><span>' + (a.openingBalance || 0) + ' ' + typeStr + '</span>';
                item.onclick = function() {
                    curAcc = a;
                    document.getElementById('accountName').value = a.name;
                    document.getElementById('balText').innerText = (a.openingBalance || 0) + ' الرصيد الحالي (' + typeStr + ')';
                    d.style.display = 'none';
                };
                d.appendChild(item);
            });
            d.style.display = 'block';
        }

        function addNewAccount() {
            let n = prompt('أدخل اسم الحساب الجديد:');
            let s = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let newObj = { id: 'acc_' + Date.now(), name: n.trim(), openingBalance: 0, balType: 'credit' };
            s.push(newObj);
            localStorage.setItem('hisabak_suppliers', JSON.stringify(s));
            curAcc = { ...newObj, role: 'مورد' };
            document.getElementById('accountName').value = newObj.name;
            document.getElementById('balText').innerText = '0.00 الرصيد الحالي (له)';
        }

        function doSave() {
            let name = document.getElementById('accountName').value.trim();
            let amt = parseFloat(document.getElementById('amount').value);

            let type = document.querySelector('input[name="type"]:checked').value;
            let cur = document.getElementById('currency').value;
            let notes = document.getElementById('notes').value;

            // تحديث الرصيد للمورد أو العميل
            let sups = JSON.parse(localStorage.getItem('hisabak_suppliers') || '[]');
            let found = false;
            let newBal = 0;
            let newType = 'credit';

            sups = sups.map(s => {
                if (s.name === name || (curAcc && s.id === curAcc.id)) {
                    found = true;
                    let signed = s.balType === 'credit' ? (parseFloat(s.openingBalance)||0) : -(parseFloat(s.openingBalance)||0);
                    if (type === 'صرف') signed -= amt; else signed += amt;
                    newType = signed >= 0 ? 'credit' : 'debit';
                    newBal = Math.abs(signed);
                    return { ...s, openingBalance: newBal, balType: newType };
                }
                return s;
            });

            if (found) localStorage.setItem('hisabak_suppliers', JSON.stringify(sups));

            // تسجيل السند في الأرشيف
            let v = JSON.parse(localStorage.getItem('hisabak_vouchers') || '[]');
            v.push({ id: Date.now(), name, type, amount: amt, currency: cur, notes, date: new Date().toLocaleDateString('ar-EG') });
            localStorage.setItem('hisabak_vouchers', JSON.stringify(v));

            alert('تم حفظ سند ال' + type + ' وتحديث رصيد ' + name + ' إلى ' + newBal + ' بنجاح');
            if (document.getElementById('closeOnSave').checked) {
                location.href = 'index.html';
            } else {
                document.getElementById('amount').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('balText').innerText = newBal + ' الرصيد الحالي (' + (newType === 'credit' ? 'له' : 'عليه') + ')';
            }
        }

        function doSend() {
            let name = document.getElementById('accountName').value.trim();
            let amt = document.getElementById('amount').value.trim();
            let type = document.querySelector('input[name="type"]:checked').value;
            let cur = document.getElementById('currency').value;
            let notes = document.getElementById('notes').value;
            let msg = '*المحاسب الإحترافي بلس*%0A*سند ' + type + '*%0Aالحساب: ' + name + '%0Aالمبلغ: ' + amt + ' ' + cur + '%0Aالبيان: ' + (notes || 'لا يوجد');
            window.open('https://wa.me/?text=' + msg, '_blank');
        }

        document.addEventListener('click', function(e) {
                document.getElementById('accountDropdown').style.display = 'none';
            }
        });
    </script>
</body>
</html>
