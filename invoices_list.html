<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاسب الإحترافي بلس</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f9; color: #333; padding-bottom: 30px; }
    .top-bar { background: #0b5cab; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .container { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: white; border: 1.5px solid #d0e0f5; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .btn { padding: 6px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>

    
    
        

    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png?v=3">
</head>
<body>
  <div class="top-bar">
    <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">✕</a>
    <span>سجل الفواتير السابقة</span>
    <span></span>
  </div>
  <div class="container">
    <input type="text" id="q" placeholder="🔍 بحث بالرقم أو العميل..." oninput="render()" style="padding:8px; border:1px solid #b6d4fe; border-radius:6px; outline:none; width:100%;">
    <div id="list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
  





<script>
(function() {
  function getLiveCurrencies() {
    try {
      const stored = localStorage.getItem("المحاسب الإحترافي بلس_currencies");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch(e) {}
    return [
      { name: "عمله محليه", symbol: "YER", rate: 1 },
      { name: "ريال سعودي", symbol: "SAR", rate: 1 },
      { name: "دولار", symbol: "USD", rate: 1 }
    ];
  }

  function applyCurrenciesToAllSelects() {
    const list = getLiveCurrencies();
    const selects = document.querySelectorAll("select");

    selects.forEach(sel => {
      // فحص إذا كان الحقل مخصصاً للعملة
      const info = (sel.id + " " + sel.name + " " + sel.className).toLowerCase();
      let isCurr = info.includes("curr") || info.includes("عملة") || info.includes("currency") || info.includes("coin");
      
      if (!isCurr) {
        // فحص نصوص الخيارات الحالية
        for (let i = 0; i < sel.options.length; i++) {
          const txt = sel.options[i].text;
          if (txt.includes("ريال") || txt.includes("دولار") || txt.includes("YER") || txt.includes("SAR") || txt.includes("USD") || txt.includes("ر.ي") || txt.includes("ر.س")) {
            isCurr = true;
            break;
          }
        }
      }

      if (isCurr) {
        const currentVal = sel.value;
        const currentText = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
        
        // التحقق إن كانت القائمة محدثة مسبقاً بنفس عدد الخيارات والرموز لتفادي التكرار
        const firstOpt = sel.options[0] ? sel.options[0].text : "";
        if (sel.getAttribute("data-synced-ver") === "2.0" && firstOpt.includes("YER")) {
          return;
        }

        sel.innerHTML = "";
        list.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.symbol;
          opt.textContent = `${c.name} (${c.symbol})`;
          opt.setAttribute("data-rate", c.rate || 1);
          if (c.symbol === currentVal || currentText.includes(c.symbol) || currentText.includes(c.name)) {
            opt.selected = true;
          }
          sel.appendChild(opt);
        });
        sel.setAttribute("data-synced-ver", "2.0");
      }
    });
  }

  // 1. تشغيل عند التحميل
  document.addEventListener("DOMContentLoaded", applyCurrenciesToAllSelects);
  window.addEventListener("load", applyCurrenciesToAllSelects);

  // 2. مراقبة مستمرة لتغيرات الـ DOM (ظهور نوافذ إضافة عميل، مورد، فاتورة جديدة، إلخ)
  const observer = new MutationObserver(function() {
    applyCurrenciesToAllSelects();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });

  // 3. فحص عند أي نقرة زر داخل الصفحة
  document.addEventListener("click", function() {
    setTimeout(applyCurrenciesToAllSelects, 50);
    setTimeout(applyCurrenciesToAllSelects, 300);
  });
})();
</script>

</body>
</html>
