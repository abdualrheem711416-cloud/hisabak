<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل الفواتير - حسابك</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f9; color: #333; padding-bottom: 30px; }
    .top-bar { background: #0b5cab; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .container { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: white; border: 1.5px solid #d0e0f5; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .btn { padding: 6px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">✕</a>
    <span>سجل الفواتير السابقة</span>
    <span></span>
  </div>
  <div class="container">
    <input type="text" id="q" placeholder="🔍 بحث بالرقم أو العميل..." oninput="render()" style="padding:8px; border:1px solid #b6d4fe; border-radius:6px; outline:none; width:100%;">
    <div id="list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
  <script>
    function render() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const all = JSON.parse(localStorage.getItem('hisabak_invoices') || '[]');
      const filtered = all.filter(i => String(i.number).includes(q) || (i.account && i.account.toLowerCase().includes(q)));
      const el = document.getElementById('list');
      if(!filtered.length) { el.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">لا توجد فواتير</div>'; return; }
      el.innerHTML = filtered.map(i => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span style="color:#0b5cab;">فاتورة #${i.number}</span>
            <span style="color:#2e7d32;">${i.opType} (${i.payType})</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span>العميل: <b>${i.account}</b></span>
            <span>الصافي: <b style="color:#d81b60;">${i.net} ر.ي</b></span>
          </div>
          <div style="font-size:11px; color:#888;">${i.date}</div>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <button class="btn" style="background:#eaf2fb; color:#0b5cab;" onclick="window.print()">🖨 طباعة</button>
            <button class="btn" style="background:#ffebee; color:#c62828;" onclick="del(${i.id})">🗑 حذف</button>
          </div>
        </div>
      `).join('');
    }
    function del(id) {
      if(!confirm('حذف الفاتورة؟')) return;
      let all = JSON.parse(localStorage.getItem('hisabak_invoices') || '[]').filter(x => x.id !== id);
      localStorage.setItem('hisabak_invoices', JSON.stringify(all));
      render();
    }
    render();
  </script>

<script>
// وظيفة مزامنة العملات في كافة شاشات التطبيق
(function() {
  function getAppCurrencies() {
    const saved = localStorage.getItem("hisabak_currencies");
    if (saved) {
      try { return JSON.parse(saved); } catch(e) {}
    }
    return [
      { id: 1, name: "عمله محليه", symbol: "YER", rate: 1 },
      { id: 2, name: "ريال سعودي", symbol: "SAR", rate: 1 },
      { id: 3, name: "دولار", symbol: "USD", rate: 1 }
    ];
  }

  function applyCurrenciesToSelects() {
    const currencies = getAppCurrencies();
    // البحث عن كافة حقول اختيار العملة في الشاشة
    const selectElements = document.querySelectorAll("select[name*='curr'], select[id*='curr'], select.currency-select, select[name='currency']");
    
    selectElements.forEach(select => {
      const currentVal = select.value;
      select.innerHTML = "";
      currencies.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.symbol;
        opt.textContent = `${c.name} (${c.symbol})`;
        opt.setAttribute("data-rate", c.rate);
        if (opt.value === currentVal) opt.selected = true;
        select.appendChild(opt);
      });
    });
  }

  window.addEventListener("DOMContentLoaded", applyCurrenciesToSelects);
  window.addEventListener("load", applyCurrenciesToSelects);
})();
</script>


<!-- مزامنة شاملة للعملات في جميع الشاشات -->
<script>
(function() {
  function fetchActiveCurrencies() {
    try {
      const data = localStorage.getItem("hisabak_currencies");
      if (data) return JSON.parse(data);
    } catch(e) {}
    return [
      { id: 1, name: "عمله محليه", symbol: "YER", rate: 1 },
      { id: 2, name: "ريال سعودي", symbol: "SAR", rate: 1 },
      { id: 3, name: "دولار", symbol: "USD", rate: 1 }
    ];
  }

  function syncAllCurrencySelects() {
    const currencies = fetchActiveCurrencies();
    // استهداف كافة حقول الاختيار المحتملة للعملة
    const selects = document.querySelectorAll("select");

    selects.forEach(sel => {
      const idOrName = (sel.id + " " + sel.name + " " + sel.className).toLowerCase();
      const parentText = (sel.parentElement ? sel.parentElement.innerText : "").toLowerCase();
      
      // الكشف التلقائي عن أي قائمة لاختيار العملة سواء بالاسم أو بالخيارات الحالية
      let isCurrencySelect = idOrName.includes("curr") || idOrName.includes("عملة") || 
                             parentText.includes("عملة") || parentText.includes("العملة");

      if (!isCurrencySelect && sel.options.length > 0) {
        for (let i = 0; i < sel.options.length; i++) {
          const t = sel.options[i].text;
          if (t.includes("ريال") || t.includes("دولار") || t.includes("YER") || t.includes("SAR") || t.includes("USD")) {
            isCurrencySelect = true;
            break;
          }
        }
      }

      if (isCurrencySelect) {
        const selectedVal = sel.value;
        sel.innerHTML = "";
        currencies.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.symbol;
          opt.textContent = `${c.name} (${c.symbol})`;
          opt.setAttribute("data-rate", c.rate);
          if (c.symbol === selectedVal || c.name === selectedVal) {
            opt.selected = true;
          }
          sel.appendChild(opt);
        });
      }
    });
  }

  // تفعيل المزامنة فوراً وعند فتح أي نافذة إضافة (Modal)
  document.addEventListener("DOMContentLoaded", syncAllCurrencySelects);
  window.addEventListener("load", syncAllCurrencySelects);
  setInterval(syncAllCurrencySelects, 800); // يغطي النوافذ المنبثقة عند الضغط على إضافة عميل/مورد/صندوق
})();
</script>

</body>
</html>
