<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>العملاء</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--p:#0288d1;--pk:#d81b60;--g:#2e7d32;--bg:#f5f7fa;}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}body{background:var(--bg);color:#263238;padding-bottom:65px;}.hdr{background:var(--p);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}.card{background:#fff;border-radius:8px;padding:10px 12px;margin:8px 10px;border:1px solid #cfd8dc;display:flex;justify-content:space-between;align-items:center;}.c-tools{display:flex;gap:12px;margin-top:6px;font-size:16px;}.c-bal{font-size:16px;font-weight:bold;color:var(--pk);}.fab{position:fixed;bottom:40px;right:20px;width:54px;height:54px;background:#e91e63;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;border:none;box-shadow:0 4px 10px rgba(0,0,0,0.3);cursor:pointer;}.bot-bar{position:fixed;bottom:0;left:0;right:0;background:var(--p);color:#fff;display:flex;justify-content:space-around;padding:5px;font-size:11px;font-weight:bold;}.st-view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:1000;flex-direction:column;}.st-tr{display:grid;grid-template-columns:1fr 1fr 1fr;padding:12px 8px;border-bottom:1px solid #eee;text-align:center;font-size:13px;}.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;padding:15px;}.modal-b{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}.modal-b input{padding:10px;border:1px solid #cfd8dc;border-radius:6px;text-align:center;}</style></head><body><div class="hdr"><h2><i class="fa-solid fa-arrow-right" onclick="location.href='index.html'"></i> العملاء</h2><div style="display:flex;gap:16px;font-size:18px;"><i class="fa-solid fa-print" onclick="window.print()"></i></div></div><div id="list"></div><button class="fab" onclick="openAdd()">+</button><div class="bot-bar"><div>له: <span id="ct">0</span></div><div>عليه: <span id="dt">0</span></div><div>الرصيد: <span id="nt">0</span></div></div><div class="st-view" id="stP"><div class="hdr"><h2><i class="fa-solid fa-arrow-right" onclick="closeSt()"></i> <span id="stT">كشف الحساب</span></h2></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--p);color:#fff;padding:8px;text-align:center;font-size:12px;"><div>النوع</div><div>المبلغ</div><div>التاريخ</div></div><div id="stRows" style="flex:1;overflow-y:auto;"></div><button class="fab" onclick="openV()">+</button></div><div class="modal-bg" id="addM"><div class="modal-b"><h3>إضافة عميل جديد</h3><input type="text" id="aN" placeholder="اسم العميل"><input type="tel" id="aP" placeholder="رقم الهاتف"><input type="number" id="aB" placeholder="الرصيد الافتتاحي" value="0"><button style="padding:10px;background:var(--p);color:#fff;border:none;border-radius:6px;" onclick="saveA()">حفظ</button><button style="padding:10px;background:#78909c;color:#fff;border:none;border-radius:6px;" onclick="closeAdd()">إلغاء</button></div></div><div class="modal-bg" id="vM"><div class="modal-b"><h3>إضافة سند</h3><input type="number" id="vA" placeholder="المبلغ"><button style="padding:10px;background:var(--p);color:#fff;border:none;border-radius:6px;" onclick="saveV()">حفظ السند</button><button style="padding:10px;background:#78909c;color:#fff;border:none;border-radius:6px;" onclick="closeV()">إلغاء</button></div></div><script>let K='hisabak_customers';let accs=JSON.parse(localStorage.getItem(K)||'[]');if(accs.length===0||typeof accs[0].name==='undefined'){accs=[{id:'1',name:'عميل نقدي عام',phone:'',bal:0,type:'debit'},{id:'2',name:'عبد الرحيم',phone:'776332929',bal:100000,type:'credit'}];localStorage.setItem(K,JSON.stringify(accs));}let act=null;function render(){let l=document.getElementById('list');l.innerHTML='';let c=0,d=0;accs.forEach(a=>{let b=parseFloat(a.bal||0);if(a.type==='credit')c+=b;else d+=b;let el=document.createElement('div');el.className='card';el.innerHTML='<div onclick="openSt(''+a.id+'')"><div style="font-weight:bold;font-size:15px;">'+a.name+'</div><div class="c-tools"><i class="fa-solid fa-comment-sms" onclick="location.href='sms:'+(a.phone||'')+''"></i> <i class="fa-brands fa-whatsapp" style="color:var(--g);" onclick="window.open('https://wa.me/?text='+encodeURIComponent('رصيدك: '+'+b+'))"></i></div></div><div class="c-bal" onclick="openSt(''+a.id+'')">'+b.toLocaleString()+'</div>';l.appendChild(el);});document.getElementById('ct').innerText=c.toLocaleString();document.getElementById('dt').innerText=d.toLocaleString();document.getElementById('nt').innerText=(d-c).toLocaleString();}function openSt(id){act=accs.find(x=>x.id===id);if(!act)return;document.getElementById('stT').innerText=act.name;let b=parseFloat(act.bal||0);document.getElementById('stRows').innerHTML='<div class="st-tr"><div>سند افتتاحي</div><div style="color:var(--pk);font-weight:bold;">'+b.toLocaleString()+'</div><div>02/10/2026</div></div>';document.getElementById('stP').style.display='flex';}function closeSt(){document.getElementById('stP').style.display='none';}function openAdd(){document.getElementById('addM').style.display='flex';}function closeAdd(){document.getElementById('addM').style.display='none';}function saveA(){let n=document.getElementById('aN').value.trim();if(!n)return;let p=document.getElementById('aP').value.trim();let b=parseFloat(document.getElementById('aB').value)||0;accs.push({id:Date.now()+'',name:n,phone:p,bal:b,type:'credit'});localStorage.setItem(K,JSON.stringify(accs));closeAdd();render();}function openV(){document.getElementById('vM').style.display='flex';}function closeV(){document.getElementById('vM').style.display='none';}function saveV(){let v=parseFloat(document.getElementById('vA').value)||0;if(!v)return;act.bal=parseFloat(act.bal||0)+v;localStorage.setItem(K,JSON.stringify(accs));closeV();openSt(act.id);render();}render();</script></body></html>
