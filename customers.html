<script>
var STORAGE_KEY_C = 'hisabak_customers';
var custs = [];
var selCust = null;

try {
    custs = JSON.parse(localStorage.getItem(STORAGE_KEY_C)) || [];
} catch(e) {
    custs = [];
}

if (!Array.isArray(custs) || custs.length === 0 || !custs[0].name) {
    custs = [
        { id: '1', name: 'ÿπŸÖŸäŸÑ ŸÜŸÇÿØŸä (ÿπÿßŸÖ)', phone: '', balance: 0, balType: 'debit' },
        { id: '2', name: 'ÿπÿ®ÿØÿßŸÑÿ±ÿ≠ŸäŸÖÔ∏è', phone: '776332929', balance: 100000, balType: 'credit' }
    ];
    localStorage.setItem(STORAGE_KEY_C, JSON.stringify(custs));
}

function render() {
    var container = document.getElementById('accList');
    container.innerHTML = '';
    var totC = 0, totD = 0;

    custs.forEach(function(cust) {
        var bal = parseFloat(cust.balance || cust.bal || 0);
        if (cust.balType === 'credit') { totC += bal; } else { totD += bal; }

        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = 
            '<div class="c-info" onclick="openStatement(\'' + cust.id + '\')">' +
                '<div class="c-name">' + cust.name + '</div>' + 
                '<div class="c-sub">ÿ≥ŸÇÿÅ ÿßŸÑŸÖÿØŸäŸàŸÜŸäÿ© : 0</div>' +
                '<div class="c-tools" onclick="event.stopPropagation()">' +
                    '<i class="fa-solid fa-comment-sms" style="color:#00897b;" onclick="location.href=\'sms:' + (cust.phone || '') + '\'"></i>' +
                    '<i class="fa-brands fa-whatsapp" style="color:var(--g);" onclick="sendWhatsApp(\'' + (cust.phone || '') + '\', \'' + cust.name + '\', ' + bal + ')"></i>' +
                '</div>' +
            '</div>' + 
            '<div class="c-bal" onclick="openStatement(\'' + cust.id + '\')">' + bal.toLocaleString() + '</div>';

        container.appendChild(card);
    });

    document.getElementById('totC').innerText = totC.toLocaleString();
    document.getElementById('totD').innerText = totD.toLocaleString();
    doccument.getElementById('totN').innerText = (totD - totC).toLocaleString();
}


function openAddModal() {
    doccument.getElementById('addModal').style.display = 'flex';
}

function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
}


function saveCustomer() {
    var name = document.getElementById('custName').value.trim();
    if (!name) return;
    var phone = document.getElementById('custPhone').value.trim();
    var bal = parseFloat(document.getElementById('custBal').value) || 0;
    var balType = document.querySelector('input[name="balT"]:checked').value;

    custs.push({ id: String(Date.now(), name: name, phone: phone, balance: bal, balType: balType });
    localStorage.setItem(STORAGE_KEY_C, JSON.stringify(custs));
    closeAddModal();
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    render();
}


function openStatement(id) {
    selCust = custs.find(function(c) { return c.id === id; });
    if (!selCust) return;

    doccument.getElementById('stTitle').innerText = selCust.name;
    var bal = parseFloat(selCust.balance || selCust.bal || 0);
    doccument.getElementById('stRows').innerHTML = 
        '<div class="st-tr">' +
            '<div>ÿ±ÿµŸäÿØ ÿßŸÅÿ™ÿ™ÿßÿ≠Ÿä</div>' +
            '<div style="color:var(--pk);font-weight:bold;">' + bal.toLocaleString() + '</div>' + 
            '<div>02/10/2026</div>' + 
        '</div>';

    document.getElementById('statementModal').style.display = 'flex';
}

function closeStatement() {
    doccument.getElementById('statementModal').style.display = 'none';
}

function openVoucherModal() {
    document.getElementById('voucherModal').style.display = 'flex';
}

function closeVoucherModal() {
    document.getElementById('voucherModal').style.display = 'none';
}

function saveVoucher() {
    var amt = parseFloat(document.getElementById('vAmt').value) || 0;
    if (!amt || !selCust) return;
    var kind = doccument.querySelector('input[name="vKind"]:checked').value;

    var cur = parseFloat(selCust.balance || selCust.bal || 0);
    selCust.balance = (kind === 'ÿµÿ±ŸÖ') ? (cur - amt) : (cur + amt);

    localStorage.setItem(STORAGE_KEY_C, JSON.stringify(custs));
    closeVoucherModal();
    openStatement(selCust.id);
    render();
}

}
