<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>فاتورة المبيعات - المحاسب الاحترافي بلس</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:#f5f7fa;
color:#263238;
padding-bottom:88px
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

.header{
background:linear-gradient(135deg,#1556c0,#1976d2);
color:#fff;
padding:12px 14px 16px;
position:sticky;
top:0;
z-index:20;
box-shadow:0 3px 12px rgba(0,0,0,.15)
}
.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}
.back{
border:0;
background:transparent;
color:#fff;
font-size:28px;
width:40px
}
.header-title{
text-align:center;
flex:1
}
.header-title b{
display:block;
font-size:19px
}
.header-title small{
font-size:11px;
opacity:.9
}
.header-icon{font-size:25px}

.tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:4px;
background:#fff;
padding:5px;
margin:8px 8px 0;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.tab{
border:0;
background:#f1f4f8;
color:#54606b;
padding:10px 3px;
border-radius:9px;
font-size:11px;
font-weight:700
}
.tab.active{
background:#1976e8;
color:#fff
}

.page{padding:9px}
.section{
background:#fff;
border:1px solid #e4e8ed;
border-radius:12px;
margin-bottom:9px;
padding:10px
}
.section-title{
font-weight:800;
font-size:14px;
color:#1556c0;
margin-bottom:9px;
display:flex;
align-items:center;
gap:6px
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
.field label{
display:block;
font-size:11px;
font-weight:700;
color:#66727d;
margin-bottom:4px
}
.field input,
.field select,
.field textarea{
width:100%;
border:1px solid #d9e0e7;
border-radius:8px;
padding:10px 9px;
font-size:13px;
background:#fff;
outline:none
}
.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#1976d2
}
.full{grid-column:1/-1}

.balance{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-bottom:9px
}
.balance-box{
background:#f5f8fc;
border-radius:10px;
padding:9px 4px;
text-align:center
}
.balance-box small{
display:block;
font-size:10px;
color:#65717d
}
.balance-box b{
display:block;
font-size:15px;
margin-top:3px
}
.balance-box.total{
background:#eaf3ff
}
.balance-box.total b{color:#1565c0}
.balance-box.new{
background:#eefaf2
}
.balance-box.new b{color:#23833e}

.add-row{
display:flex;
gap:7px;
align-items:center
}
.search{
flex:1
}
.add-btn{
border:0;
background:#1976e8;
color:#fff;
border-radius:9px;
padding:11px 13px;
font-weight:800;
white-space:nowrap
}

.items{
overflow-x:auto
}
table{
width:100%;
border-collapse:collapse;
min-width:610px
}
th{
background:#edf4fc;
color:#1556c0;
font-size:11px;
padding:9px 5px
}
td{
border-bottom:1px solid #edf0f3;
padding:7px 5px;
font-size:11px;
text-align:center
}
.qty,.price{
width:70px;
border:1px solid #dce2e8;
border-radius:6px;
padding:7px 4px;
text-align:center
}
.delete{
border:0;
background:#fff0f0;
color:#d32f2f;
border-radius:6px;
padding:6px 8px
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}
.sum-box{
border:1px solid #e3e8ee;
border-radius:9px;
padding:9px
}
.sum-box label{
font-size:10px;
color:#697680;
display:block;
margin-bottom:3px
}
.sum-box input{
width:100%;
border:0;
outline:0;
font-weight:800;
font-size:14px
}
.grand{
background:#eaf3ff;
border:1px solid #cfe3fa;
border-radius:11px;
padding:12px;
margin-top:8px;
display:flex;
justify-content:space-between;
align-items:center
}
.grand span{font-weight:700}
.grand b{
font-size:21px;
color:#1556c0
}

textarea{resize:none;min-height:
