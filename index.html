<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حسابك - التطبيق الشامل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --p: #1976d2; --sec: #0288d1; --bg: #f8f9fa; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); min-height: 100vh; padding-bottom: 70px; }

/* الشريط العلوي الشامل */
.app-hdr { background: var(--p); color: #fff; padding: 16px; text-align: center; font-size: 19px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

/* القائمة الشاملة للأقسام */
.modules-container { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
.module-card { background: #fff; padding: 16px 18px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; text-decoration: none; color: #212121; font-weight: bold; font-size: 16px; border-right: 6px solid var(--p); transition: transform 0.1s; }
.module-card:active { transform: scale(0.98); background: #f1f1f1; }
.module-info { display: flex; align-items: center; gap: 14px; }
.module-icon { width: 44px; height: 44px; background: #e3f2fd; color: var(--p); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.module-name { font-size: 16px; color: #333; }
.module-arrow { color: #888; font-size: 14px; }
</style>
</head>
<body>

<div class="app-hdr">نظام حسابك - الشاشة الرئيسية</div>

<div class="modules-container">
    <a href="items.html" class="module-card">
        <div class="module-info">
            <div class="module-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="module-name">ملف الأصناف</div>
        </div>
        <i class="fa-solid fa-chevron-left module-arrow"></i>
    </a>

    <a href="stores.html" class="module-card" style="border-right-color: #0288d1;">
        <div class="module-info">
            <div class="module-icon" style="color: #0288d1;"><i class="fa-solid fa-warehouse"></i></div>
            <div class="module-name">ملف المخازن</div>
        </div>
        <i class="fa-solid fa-chevron-left module-arrow"></i>
    </a>

    <a href="settings_menu.html" class="module-card" style="border-right-color: #7b1fa2;">
        <div class="module-info">
            <div class="module-icon" style="color: #7b1fa2; background: #f3e5f5;"><i class="fa-solid fa-gear"></i></div>
            <div class="module-name">إعدادات النظام</div>
        </div>
        <i class="fa-solid fa-chevron-left module-arrow"></i>
    </a>
</div>

</body>
</html>
