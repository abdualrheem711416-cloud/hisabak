<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>







<script>
window.addEventListener("DOMContentLoaded", function() {
  // فك أي ارتباطات قديمة بالنقر على الحاويات
  function enforceDashboardButtons() {
    const cardSelectors = document.querySelectorAll(".card, .menu-card, .grid-item, div, a");
    
    cardSelectors.forEach(function(el) {
      const txt = (el.innerText || "").trim();
      
      if (txt === "سند جديد") {
        el.style.cursor = "pointer";
        el.onclick = function(e) { e.preventDefault(); e.stopPropagation(); window.location.href = "vouchers.html"; };
      } 
      else if (txt === "فاتورة جديدة") {
        el.style.cursor = "pointer";
        el.onclick = function(e) { e.preventDefault(); e.stopPropagation(); window.location.href = "invoice.html"; };
      } 
      else if (txt === "كشف حساب" || txt === "كشف حساب تفصيلي") {
        el.style.cursor = "pointer";
        el.onclick = function(e) { e.preventDefault(); e.stopPropagation(); window.location.href = "statement.html"; };
      }
      else if (["حوالة جديدة", "حوالة جديد", "قيد بسيط", "الحركة اليومية", "صناديق النقدية", "صرف عملات", "البحث السريع"].indexOf(txt) !== -1) {
        el.style.cursor = "default";
        el.removeAttribute("href");
        el.onclick = function(e) { e.preventDefault(); e.stopPropagation(); return false; };
      }
    });
  }

  enforceDashboardButtons();
  setTimeout(enforceDashboardButtons, 300);
  setTimeout(enforceDashboardButtons, 800);
});
</script>

</body>
</html>
<!-- كود توجيه البطاقات التسع الحصري والمحمي -->
