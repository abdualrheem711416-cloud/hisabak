<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
function processExcel() {
  const f = document.getElementById('excelCustomFile');
  const st = document.getElementById('excelStatus');
    st.style.color = 'red'; st.textContent = 'يرجى اختيار ملف أولاً'; return;
  }
  st.style.color = '#0d62b5'; st.textContent = 'جاري المعالجة...';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      st.style.color = 'green';
      st.textContent = 'تم استيراد ' + rows.length + ' صنف بنجاح!';
      setTimeout(() => { document.getElementById('excelModalOfficial').style.display = 'none'; }, 2000);
    } catch(err) {
      st.style.color = 'red'; st.textContent = 'فشل قراءة الملف';
    }
  };
  reader.readAsArrayBuffer(f.files[0]);
}
</script>

<!-- Suppliers Modal -->
<div id="suppliers-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000; align-items:center; justify-content:center; direction:rtl;">

    <div style="margin-top:15px;">

      <input type="number" id="sup-balance" placeholder="الرصيد الافتتاحي (ر.ي)" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
      <button onclick="addSupplier()" style="width:100%; background:#0b5cab; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">إضافة مورد</button>
    </div>

    <div style="margin-top:20px;">
      <h4 style="margin:0 0 10px 0; color:#333;">قائمة الموردين:</h4>
      <div id="suppliers-list" style="max-height:200px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script>
function openSuppliers() {
  document.getElementById('suppliers-modal').style.display = 'flex';
  renderSuppliers();
}

function closeSuppliersModal() {
  document.getElementById('suppliers-modal').style.display = 'none';
}

function getSuppliers() {
  const data = localStorage.getItem('hisabak_suppliers');
  return data ? JSON.parse(data) : [
    { name: 'شركة الأمل للتوريدات', balance: 3507845 }
  ];
}

function renderSuppliers() {
  const list = getSuppliers();
  const container = document.getElementById('suppliers-list');
  if (list.length === 0) {
    container.innerHTML = '<p style="color:#888; font-size:14px; text-align:center;">لا يوجد موردين مسجلين</p>';
    return;
  }
  let html = '';
  list.forEach((s, idx) => {
    html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee;">' +
      '<div>' +
        '<strong>' + s.name + '</strong>' +
        '<div style="font-size:12px; color:#d9534f;">' + Number(s.balance).toLocaleString() + ' ر.ي</div>' +
      '</div>' +
      '<button onclick="deleteSupplier(' + idx + ')" style="background:#ff4d4d; color:white; border:none; border-radius:4px; padding:4px 8px; font-size:12px; cursor:pointer;">حذف</button>' +
    '</div>';
  });
  container.innerHTML = html;
}

function addSupplier() {
  const name = document.getElementById('sup-name').value.trim();
  const bal = parseFloat(document.getElementById('sup-balance').value) || 0;
  if (!name) {
    alert('يرجى كتابة اسم المورد');
    return;
  }
  const list = getSuppliers();
  list.unshift({ name: name, balance: bal });
  localStorage.setItem('hisabak_suppliers', JSON.stringify(list));
  document.getElementById('sup-name').value = '';
  document.getElementById('sup-balance').value = '';
  renderSuppliers();
}

function deleteSupplier(idx) {
  const list = getSuppliers();
  list.splice(idx, 1);
  localStorage.setItem('hisabak_suppliers', JSON.stringify(list));
  renderSuppliers();
}
</script>

<div id="fix-suppliers-override"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  // اعتراض أي عنصر يحتوي على كلمة الموردين وتحويله لفتح النافذة
  document.querySelectorAll('*').forEach(el => {
    if (el.children.length === 0 && el.innerText && el.innerText.includes('الموردين')) {
      const card = el.closest('.card') || el.parentElement;
      if (card) {
        card.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (typeof openSuppliers === 'function') {
            openSuppliers();
          } else {
            alert('جاري تجهيز قسم الموردين');
          }
        };
      }
    }
  });
});

// تعطيل نافذة التنبيه المزعجة في حال استدعائها
const _oldAlert = window.alert;
window.alert = function(msg) {
  if (typeof msg === 'string' && msg.includes('الموردين')) {
    if (typeof openSuppliers === 'function') {
      openSuppliers();
      return;
    }
  }
  _oldAlert(msg);
};
</script>


<script>
// إصلاح شامل لإغلاق النوافذ المنبثقة
function closeCurrentModal() {
  const modals = document.querySelectorAll(".modal, [id*="modal"], [class*="modal"], .popup, [id*="popup"], [class*="popup"]");
  modals.forEach(m => {
    if (m.style.display !== "none") {
      m.style.display = "none";
    }
  });
  // إزالة أي طبقة تعتيم خلفية
  document.querySelectorAll(".modal-backdrop, .backdrop, .overlay").forEach(b => b.remove());
}

document.addEventListener("DOMContentLoaded", () => {
  // 1. ربط أي زر يحمل علامة X أو زر إغلاق
  document.body.addEventListener("click", (e) => {
    const target = e.target;
    if (target.textContent.trim() === "×" || target.textContent.trim() === "✕" || target.classList.contains("close") || target.getAttribute("data-dismiss") === "modal") {
      e.preventDefault();
      e.stopPropagation();
      closeCurrentModal();
    }
    // 2. إغلاق عند الضغط خارج المربع الأبيض
    if (target.classList.contains("modal") || target.classList.contains("modal-overlay") || target.classList.contains("backdrop")) {
      closeCurrentModal();
    }
  }, true);

  // 3. ربط زر الرجوع في الهاتف بإغلاق النافذة المنبثقة
  window.addEventListener("popstate", () => {
    closeCurrentModal();
  });
});
</script>
