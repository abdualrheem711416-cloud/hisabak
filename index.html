<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>







<script>
(function() {
  function fixGridCards() {
    // قائمة النصوص للبطاقات المفعلة والصلبة
    const targetMap = {
      "سند جديد": "vouchers.html",
      "فاتورة جديدة": "invoice.html",
      "كشف حساب": "statement.html",
      "كشف الحساب": "statement.html"
    };

    const disabledList = [
      "حوالة جديدة", "حوالة جديد", "صناديق النقدية", 
      "الحركة اليومية", "قيد بسيط", "البحث السريع", "صرف عملات"
    ];

    // استهداف جميع العناصر داخل الصفحة
    const elements = document.querySelectorAll("a, button, div, span, p");
    elements.forEach(el => {
      const text = (el.textContent || "").trim();

      // فحص إذا كان العنصر هو إحدى البطاقات المفعلة
      for (const [key, targetUrl] of Object.entries(targetMap)) {
        if (text === key) {
          const card = el.closest("a") || el.closest(".card") || el.parentElement || el;
          if (card.tagName === "A") card.removeAttribute("href");
          card.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            window.location.href = targetUrl;
            return false;
          };
          card.style.cursor = "pointer";
          break;
        }
      }

      // فحص إذا كان العنصر من البطاقات الصلبة
      if (disabledList.includes(text)) {
        const card = el.closest("a") || el.closest(".card") || el.parentElement || el;
        if (card.tagName === "A") card.removeAttribute("href");
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return false;
        };
        card.style.cursor = "default";
      }
    });
  }

  // تنفيذ الفحص الفوري وتكراره لضمان تجاوزه لأي كود آخر
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fixGridCards);
  } else {
    fixGridCards();
  }
  window.addEventListener("load", fixGridCards);
  setTimeout(fixGridCards, 300);
})();
</script>

</body>
</html>
