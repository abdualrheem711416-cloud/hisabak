<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>




<script>
// تحديث فوري للكاش والتسجيل
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (let reg of regs) {
      reg.update();
    }
  });
}
</script>


<script>
document.addEventListener("DOMContentLoaded", function() {
  function applyAccurateRouting() {
    // جلب البطاقات أو الروابط المباشرة
    const clickableElements = document.querySelectorAll(".card, .menu-card, .btn-card, a, [onclick]");
    
    // تعطيل الروابط الافتراضية للبطاقات لضبطها بدقة
    document.querySelectorAll("a").forEach(a => {
      const txt = (a.innerText || "").trim();
      if (txt.includes("سند جديد") || txt.includes("فاتورة جديدة") || txt.includes("كشف حساب تفصيلي") ||
          txt.includes("سجل الفواتير") || txt.includes("حوالة جديد") || txt.includes("قيد بسيط") ||
          txt.includes("الحركة اليومية") || txt.includes("صناديق النقدية") || txt.includes("صرف عملات") || txt.includes("البحث السريع")) {
        a.removeAttribute("href");
      }
    });

    // استهداف دقيق لكل عنصر بناء على نصه الصريح فقط
    const allItems = document.querySelectorAll("div, button, a, li");
    
    allItems.forEach(el => {
      // نأخذ النص المباشر للعنصر لتجنب أخذ نصوص العناصر الأب
      const directText = Array.from(el.childNodes)
        .filter(n => n.nodeType === Node.TEXT_NODE)
        .map(n => n.textContent.trim())
        .join(" ") || el.innerText.trim();

      // 1. سند جديد -> vouchers.html حصراً
      if (directText === "سند جديد" || el.getAttribute("data-title") === "سند جديد") {
        const card = el.closest(".card") || el.closest("a") || el;
        card.style.cursor = "pointer";
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = "vouchers.html";
        };
      }
      
      // 2. فاتورة جديدة -> invoice.html حصراً
      else if (directText === "فاتورة جديدة" || el.getAttribute("data-title") === "فاتورة جديدة") {
        const card = el.closest(".card") || el.closest("a") || el;
        card.style.cursor = "pointer";
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = "invoice.html";
        };
      }
      
      // 3. كشف حساب تفصيلي -> statement.html حصراً
      else if (directText === "كشف حساب تفصيلي" || directText === "كشف حساب" || el.getAttribute("data-title") === "كشف حساب") {
        const card = el.closest(".card") || el.closest("a") || el;
        card.style.cursor = "pointer";
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = "statement.html";
        };
      }
      
      // 4. سجل الفواتير السابقة -> invoices_list.html
      else if (directText === "سجل الفواتير" || directText === "الفواتير السابقة") {
        const card = el.closest(".card") || el.closest("a") || el;
        card.style.cursor = "pointer";
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = "invoices_list.html";
        };
      }
      
      // 5. بقية البطاقات تبقى صلبة وغير قابلة للنقر
      else if (["حوالة جديد", "قيد بسيط", "الحركة اليومية", "صناديق النقدية", "صرف عملات", "البحث السريع"].includes(directText)) {
        const card = el.closest(".card") || el.closest("a") || el;
        card.removeAttribute("href");
        card.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        };
        card.style.cursor = "default";
      }
    });
  }

  applyAccurateRouting();
  setTimeout(applyAccurateRouting, 400);
});
</script>

</body>
</html>
