<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المحاسب الإحترافي بلس</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1565c0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        .container {
            padding: 15px;
            max-width: 900px;
            margin: auto;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 55px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            color: #1565c0;
            box-shadow: 0 2px 7px rgba(0,0,0,.08);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: white;
            min-height: 105px;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            color: #222;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .card i {
            font-size: 30px;
            color: #1565c0;
            margin-bottom: 9px;
        }

        .card span {
            font-weight: bold;
            font-size: 15px;
        }

        .fab-orange {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 58px;
            height: 58px;
            border: 0;
            border-radius: 50%;
            background: #ff9800;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .quick-actions,
            .cards {
                grid-template-columns: 1fr 1fr;
            }

            header h1 {
                font-size: 20px;
            }
        }
    </style>
    <script src="core/storage.js"></script>
<script src="core/accounting.js"></script><script src="core/inventory.js"></script>
</head>

<body>

<header>
    <h1>المحاسب الإحترافي بلس</h1>
</header>

<div class="container">

    <div class="quick-actions">

        <a href="vouchers.html" class="quick-btn">
            <i class="fa-solid fa-file-invoice"></i>
            سند جديد
        </a>

        <a href="vouchers.html" class="quick-btn">
            <i class="fa-solid fa-money-bill-transfer"></i>
            حوالة جديدة
        </a>

        <a href="statement.html" class="quick-btn">
            <i class="fa-solid fa-file-lines"></i>
            كشف حساب
        </a>

        <a href="vouchers.html" class="quick-btn">
            <i class="fa-solid fa-pen-to-square"></i>
            قيد بسيط
        </a>

        <a href="vouchers.html" class="quick-btn">
            <i class="fa-solid fa-list"></i>
            الحركة اليومية
        </a>

        <a href="vouchers.html" class="quick-btn">
            <i class="fa-solid fa-cash-register"></i>
            صناديق النقدية
        </a>

        <a href="invoice.html" class="quick-btn">
            <i class="fa-solid fa-receipt"></i>
            فاتورة جديدة
        </a>

        <a href="currencies.html" class="quick-btn">
            <i class="fa-solid fa-money-bill"></i>
            صرف عملات
        </a>

        <a href="items.html" class="quick-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            البحث السريع
        </a>

    </div>

    <div class="cards">

        <a href="suppliers.html" class="card">
            <i class="fa-solid fa-truck"></i>
            <span>الموردين</span>
        </a>

        <a href="customers.html" class="card">
            <i class="fa-solid fa-users"></i>
            <span>العملاء</span>
        </a>

        <a href="statement.html" class="card">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            <span>الديون</span>
        </a>

        <a href="settings_menu.html" class="card">
            <i class="fa-solid fa-user-tie"></i>
            <span>الموظفين</span>
        </a>

        <a href="vouchers.html" class="card">
            <i class="fa-solid fa-money-bill-wave"></i>
            <span>المصروفات</span>
        </a>

        <a href="items.html" class="card">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>الأصناف</span>
        </a>

        <a href="stores.html" class="card">
            <i class="fa-solid fa-store"></i>
            <span>المخازن</span>
        </a>

        <a href="settings.html" class="card">
            <i class="fa-solid fa-gear"></i>
            <span>الإعدادات</span>
        </a>

    </div>

</div>

<button type="button" class="fab-orange"
        onclick="location.href='vouchers.html'">
    <i class="fa-solid fa-plus"></i>
</button>

<script>
    </body>
</html>
