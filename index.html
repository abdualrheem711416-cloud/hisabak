<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="icon-512.png">

  <!-- إعدادات تثبيت التطبيق PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d62b3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حسابك">
  <link rel="apple-touch-icon" href="icon-512.png">
  











<script>
// دالة إغلاق أي نافذة مفتوحة
window.dismissAllModals = function() {
  const m = document.getElementById("customers-modal-box");
  if (m) m.remove();
  const s = document.getElementById("suppliers-modal-root");
  if (s) s.remove();
  document.querySelectorAll(".modal, [id*="modal"]").forEach(el => el.style.display = "none");
};

// دالة فتح نافذة العملاء متضمنة الهاتف ورسائل الواتساب الفورية
window.showCustomersDialog = function() {
  window.dismissAllModals();

  let customers = JSON.parse(localStorage.getItem("hisabak_customers") || "[]");
  if (customers.length === 0) {
    customers = [
      { id: 1, name: "عميل نقدي عام", phone: "", balance: 0 },
      { id: 2, name: "شركة النور", phone: "777000000", balance: 150000 }
    ];
    localStorage.setItem("hisabak_customers", JSON.stringify(customers));
  }

  const modalHtml = `
    <div id="customers-modal-box" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:999999; display:flex; align-items:center; justify-content:center; direction:rtl; font-family:sans-serif; padding:15px; box-sizing:border-box;">
      <div style="background:#fff; width:100%; max-width:400px; border-radius:14px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.3); max-height:88vh; display:flex; flex-direction:column;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee; background:#fafafa;">
          <button id="cust-x-btn" style="background:#eee; border:none; width:34px; height:34px; border-radius:50%; font-size:18px; font-weight:bold; cursor:pointer; color:#444;">✕</button>
          <h3 style="margin:0; font-size:18px; color:#0d62b3; font-weight:bold;">إدارة العملاء</h3>
        </div>

        <div style="padding:16px; overflow-y:auto; flex:1;">
          <input type="text" id="c-name" placeholder="اسم العميل" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:14px;">
          <input type="tel" id="c-phone" placeholder="رقم الهاتف (واتساب)" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:14px;">
          <input type="number" id="c-bal" placeholder="الرصيد الافتتاحي (ر.ي)" style="width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:14px;">
          
          <button id="c-save-btn" style="width:100%; background:#0d62b3; color:#fff; padding:11px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px;">إضافة عميل</button>

          <h4 style="margin:16px 0 8px; color:#333; font-size:15px;">قائمة العملاء:</h4>
          <div id="c-list-box" style="max-height:220px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", modalHtml);

  function renderRows() {
    const box = document.getElementById("c-list-box");
    box.innerHTML = "";
    customers.forEach((c, idx) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid #eee;";
      row.innerHTML = `
        <div style="display:flex; gap:6px; align-items:center;">
          <button data-del="${idx}" style="background:#e74c3c; color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer;">حذف</button>
          <button data-ws="${idx}" style="background:#25D366; color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer;">💬 واتساب</button>
        </div>
        <div style="text-align:left;">
          <div style="font-weight:bold; color:#222; font-size:14px;">${c.name}</div>
          <div style="font-size:12px; color:#666;">${c.phone ? "📞 " + c.phone : "بدون هاتف"}</div>
          <div style="color:#27ae60; font-size:12px; font-weight:bold;">${Number(c.balance).toLocaleString()} ر.ي</div>
        </div>
      `;
      box.appendChild(row);
    });

    box.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        customers.splice(b.getAttribute("data-del"), 1);
        localStorage.setItem("hisabak_customers", JSON.stringify(customers));
        renderRows();
      };
    });

    box.querySelectorAll("[data-ws]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const item = customers[b.getAttribute("data-ws")];
        if (!item.phone) return alert("يرجى إدخال رقم هاتف العميل أولاً");
        const clean = item.phone.replace(/[^0-9]/g, "");
        const txt = encodeURIComponent(`مرحباً أستاذ ${item.name}،
إشعار من تطبيق حسابك:
رصيد حسابكم الحالي: ${Number(item.balance).toLocaleString()} ر.ي.`);
        window.open(`https://api.whatsapp.com/send?phone=${clean}&text=${txt}`, "_blank");
      };
    });
  }

  renderRows();

  // إغلاق النافذة
  document.getElementById("cust-x-btn").onclick = () => window.dismissAllModals();
  document.getElementById("customers-modal-box").onclick = (e) => {
    if (e.target.id === "customers-modal-box") window.dismissAllModals();
  };

  // زر الإضافة
  document.getElementById("c-save-btn").onclick = () => {
    const name = document.getElementById("c-name").value.trim();
    const phone = document.getElementById("c-phone").value.trim();
    const bal = parseFloat(document.getElementById("c-bal").value) || 0;
    if (!name) return alert("يرجى إدخال اسم العميل");

    const newEntry = { id: Date.now(), name, phone, balance: bal };
    customers.push(newEntry);
    localStorage.setItem("hisabak_customers", JSON.stringify(customers));

    document.getElementById("c-name").value = "";
    document.getElementById("c-phone").value = "";
    document.getElementById("c-bal").value = "";
    renderRows();
  };
};

// الاستماع المباشر باللمس والنقر على بطاقة العملاء
document.addEventListener("pointerdown", function(e) {
  const target = e.target;
  if (target.id === "cust-x-btn" || target.innerText === "✕") {
    e.preventDefault();
    window.dismissAllModals();
    return;
  }
  
  const el = target.closest("div, .card, a, button");
  if (el && el.innerText && el.innerText.includes("العملاء") && !target.closest("#customers-modal-box")) {
    e.preventDefault();
    e.stopPropagation();
    window.showCustomersDialog();
  }
}, true);
</script>

</body>
</html>
