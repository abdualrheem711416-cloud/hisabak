<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>







<script>
(function() {
  const currenciesList = [
    { name: "عمله محليه", symbol: "YER" },
    { name: "ريال سعودي", symbol: "SAR" },
    { name: "دولار", symbol: "USD" }
  ];

  function syncCurrenciesSafely() {
    const selects = document.querySelectorAll("select");
    selects.forEach(function(sel) {
      const idOrName = (sel.id + " " + sel.name + " " + sel.className).toLowerCase();
      const isCurrencySelect = idOrName.includes("curr") || idOrName.includes("عمل") || 
                               sel.innerHTML.includes("ريال") || sel.innerHTML.includes("دولار") || sel.innerHTML.includes("YER");
      
      if (isCurrencySelect && sel.getAttribute("data-populated") !== "yes") {
        const currentVal = sel.value;
        sel.innerHTML = "";
        currenciesList.forEach(function(c) {
          const opt = document.createElement("option");
          opt.value = c.symbol;
          opt.textContent = c.name + " (" + c.symbol + ")";
          if (c.symbol === currentVal) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.setAttribute("data-populated", "yes");
      }
    });
  }

  // تشغيل المزامنة تلقائياً عند تغيير محتوى الصفحة مع الحفاظ على النقر
  const observer = new MutationObserver(function() {
    syncCurrenciesSafely();
  });
  observer.observe(document.body, { childList: true, subtree: true });
  window.addEventListener("load", syncCurrenciesSafely);
})();
</script>

</body>
</html>
