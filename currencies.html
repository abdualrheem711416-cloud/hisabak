<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إدارة العملات - المحاسب الإحترافي بلس</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --p: #1565c0; --sec: #1976d2; --bg: #f0f2f5; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); min-height: 100vh; padding-bottom: 70px; direction: rtl; }

/* الشريط العلوي */
.app-header { background: var(--p); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.app-title { font-size: 18px; font-weight: bold; }
.back-btn { color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; }

/* محتوى الصفحة */
.content-container { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* نموذج الإضافة */
.form-card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 14px; font-weight: bold; color: #333; }
.form-control { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
.form-control:focus { border-color: var(--p); }

.btn-primary { background: var(--p); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
.btn-primary:active { opacity: 0.9; }

/* جدول أو قائمة العملات */
.currencies-list { display: flex; flex-direction: column; gap: 10px; }
.currency-item { background: #fff; padding: 14px 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-right: 5px solid var(--p); }
.curr-info { display: flex; flex-direction: column; gap: 4px; }
.curr-name { font-size: 16px; font-weight: bold; color: #212121; }
.curr-rate { font-size: 14px; color: #666; }
.curr-actions { display: flex; gap: 10px; color: #d32f2f; cursor: pointer; font-size: 18px; }
</style>
</head>
<body>

<div class="app-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
    <div class="app-title">إدارة العملات وسعر الصرف</div>
    <div></div>
</div>

<div class="content-container">
    <!-- نموذج إضافة عملة جديدة -->
    <div class="form-card">
        <div class="form-group">
            <label>اسم العملة (مثال: ريال يمني، دولار أمريكي)</label>
            <input type="text" id="currName" class="form-control" placeholder="أدخل اسم العملة">
        </div>
        <div class="form-group">
            <label>رمز العملة (مثال: ر.ي، $)</label>
            <input type="text" id="currSymbol" class="form-control" placeholder="أدخل الرمز">
        </div>
        <div class="form-group">
            <label>سعر الصرف مقابل العملة الأساسية</label>
            <input type="number" step="0.01" id="currRate" class="form-control" placeholder="0.00">
        </div>
        <button type="button" class="btn-primary" onclick="addCurrency()">حفظ وإضافة العملة</button>
    </div>

    <!-- قائمة العملات المضافة -->
    <div class="currencies-list" id="currenciesList">
        <div class="currency-item">
            <div class="curr-info">
                <div class="curr-name">الريال اليمني (ر.ي)</div>
                <div class="curr-rate">السعر الأساسي: 1.00</div>
            </div>
            <div class="curr-actions"><i class="fa-solid fa-trash-can" style="color: #ccc;"></i></div>
        </div>
        <div class="currency-item" style="border-right-color: #00796b;">
            <div class="curr-info">
                <div class="curr-name">الدولار الأمريكي ($)</div>
                <div class="curr-rate">سعر الصرف: 530.00 ر.ي</div>
            </div>
            <div class="curr-actions"><i class="fa-solid fa-trash-can" onclick="this.closest('.currency-item').remove()"></i></div>
        </div>
    </div>
</div>

<script>
function addCurrency() {
    const name = document.getElementById('currName').value;
    const symbol = document.getElementById('currSymbol').value;
    const rate = document.getElementById('currRate').value;

    if(!name || !rate) {
        alert('الرجاء إدخال اسم العملة وسعر الصرف على الأقل');
        return;
    }

    const list = document.getElementById('currenciesList');
    const item = document.createElement('div');
    item.className = 'currency-item';
    item.innerHTML = `
        <div class="curr-info">
            <div class="curr-name">\${name} (\${symbol})</div>
            <div class="curr-rate">سعر الصرف: \${rate}</div>
        </div>
        <div class="curr-actions"><i class="fa-solid fa-trash-can" onclick="this.closest('.currency-item').remove()"></i></div>
    `;
    list.appendChild(item);

    document.getElementById('currName').value = '';
    document.getElementById('currSymbol').value = '';
    document.getElementById('currRate').value = '';
}
</script>

</body>
</html>
