<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة المبيعات - المحاسب الاحترافي بلس</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

body{
  margin:0;
  background:#f5f7fa;
  color:#263238;
  padding-bottom:95px;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* الرأس */
.header{
  background:linear-gradient(135deg,#1556c0,#1976d2);
  color:#fff;
  padding:12px 14px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.back-btn{
  border:0;
  background:transparent;
  color:#fff;
  font-size:26px;
  width:42px;
}

.header-title{
  text-align:center;
  flex:1;
}

.header-title b{
  display:block;
  font-size:19px;
}

.header-title small{
  display:block;
  font-size:11px;
  opacity:.9;
  margin-top:3px;
}

.header-icon{
  font-size:25px;
  width:42px;
  text-align:center;
}

/* التبويبات */
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:#fff;
  padding:6px;
  margin:8px 10px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab{
  border:0;
  background:#f1f4f8;
  color:#54606b;
  padding:10px 3px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}

.tab.active{
  background:#1976d2;
  color:#fff;
}

/* المحتوى */
.container{
  padding:10px;
}

.section{
  background:#fff;
  border:1px solid #e1e7ee;
  border-radius:13px;
  margin-bottom:10px;
  padding:10px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  color:#1556c0;
  margin-bottom:9px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.field label{
  font-size:11px;
  color:#66727d;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d5dce4;
  border-radius:8px;
  padding:9px;
  background:#fff;
  font-size:13px;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#1976d2;
}

.full{
  grid-column:1 / -1;
}

/* بيانات العميل */
.account-box{
  display:flex;
  gap:7px;
}

.account-box select{
  flex:1;
}

.add-btn{
  width:42px;
  border:0;
  border-radius:8px;
  background:#e8f1ff;
  color:#1556c0;
  font-size:22px;
  font-weight:700;
}

/* طريقة الدفع */
.payment-row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.payment-option{
  border:1px solid #d5dce4;
  background:#fff;
  border-radius:9px;
  padding:9px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.payment-option.active{
  border-color:#1976d2;
  background:#eaf3ff;
  color:#1556c0;
}

/* جدول الأصناف */
.items-header{
  display:grid;
  grid-template-columns:2fr .8fr 1fr 1fr 36px;
  gap:4px;
  background:#1976d2;
  color:#fff;
  padding:9px 5px;
  border-radius:9px 9px 0 0;
  font-size:11px;
  font-weight:700;
  text-align:center;
}

.item-row{
  display:grid;
  grid-template-columns:2fr .8fr 1fr 1fr 36px;
  gap:4px;
  padding:7px 5px;
  border:1px solid #e5e9ee;
  border-top:0;
  background:#fff;
  font-size:11px;
  align-items:center;
  text-align:center;
}

.item-row input{
  width:100%;
  border:1px solid #d8dee5;
  border-radius:6px;
  padding:7px 3px;
  text-align:center;
}

.delete-item{
  border:0;
  background:#fff0f0;
  color:#d32f2f;
  border-radius:6px;
  height:30px;
}

/* إضافة صنف */
.add-item{
  margin-top:8px;
  width:100%;
  border:1px dashed #1976d2;
  background:#f4f8ff;
  color:#1556c0;
  border-radius:9px;
  padding:10px;
  font-weight:700;
}

/* الإجماليات */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.summary-box{
  border:1px solid #e1e6eb;
  border-radius:9px;
  padding:8px;
}

.summary-box label{
  display:block;
  font-size:11px;
  color:#697680;
  margin-bottom:4px;
}

.summary-box input{
  width:100%;
  border:0;
  outline:0;
  font-size:14px;
  font-weight:800;
  background:transparent;
}

.total-box{
  margin-top:8px;
  background:#eaf3ff;
  border:1px solid #c8ddfa;
  border-radius:10px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  font-weight:800;
  color:#1556c0;
}

.total-box strong{
  font-size:20px;
  color:#1556c0;
}

/* أزرار الحفظ */
.bottom-actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #dce3ea;
  padding:9px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  z-index:50;
}

.action-btn{
  border:0;
  border-radius:9px;
  padding:11px 5px;
  font-size:11px;
  font-weight:800;
}

.save{
  background:#1976d2;
  color:#fff;
}

.print{
  background:#e8f1ff;
  color:#1556c0;
}

.new{
  background:#edf7ef;
  color:#28743a;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div class="header-title">
      <b id="invoiceTitle">فاتورة المبيعات</b>
      <small>المحاسب الاحترافي بلس</small>
    </div>
    <div class="header-icon">🧾</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-type="sale" onclick="setInvoiceType('sale')">فاتورة بيع</button>
  <button class="tab" data-type="purchase" onclick="setInvoiceType('purchase')">فاتورة شراء</button>
  <button class="tab" data-type="sales_return" onclick="setInvoiceType('sales_return')">مرتجع بيع</button>
  <button class="tab" data-type="purchase_return" onclick="setInvoiceType('purchase_return')">مرتجع شراء</button>
</div>

<main class="container">

  <!-- معلومات الفاتورة -->
  <section class="section">
    <div class="section-title">📄 معلومات الفاتورة</div>
    <div class="grid-2">
      <div class="field">
        <label>رقم الفاتورة</label>
        <input id="invoiceNo" type="text" value="1001">
      </div>
      <div class="field">
        <label>التاريخ</label>
        <input id="invoiceDate" type="date">
      </div>
      <div class="field">
        <label>نوع الفاتورة</label>
        <select id="invoiceType" onchange="setInvoiceType(this.value)">
          <option value="sale">بيع</option>
          <option value="purchase">شراء</option>
          <option value="sales_return">مرتجع بيع</option>
          <option value="purchase_return">مرتجع شراء</option>
        </select>
      </div>
      <div class="field">
        <label>المستودع</label>
        <select id="warehouse">
          <option value="main">المستودع الرئيسي</option>
        </select>
      </div>
    </div>
  </section>

  <!-- العميل / المورد -->
  <section class="section">
    <div class="section-title">👤 الطرف</div>
    <div class="grid-2">
      <div class="field full">
        <label id="partyLabel">العميل</label>
        <div class="account-box">
          <select id="customer">
            <option value="">اختر العميل</option>
            <option value="cash">عميل نقدي</option>
          </select>
          <button class="add-btn" type="button" onclick="addParty()">+</button>
        </div>
      </div>
      <div class="field">
        <label>العملة</label>
        <select id="currency">
          <option value="YER">ريال يمني</option>
          <option value="SAR">ريال سعودي</option>
          <option value="USD">دولار</option>
        </select>
      </div>
      <div class="field">
        <label>سعر الصرف</label>
        <input id="exchangeRate" type="number" value="1">
      </div>
    </div>
  </section>

  <!-- طريقة الدفع -->
  <section class="section">
    <div class="section-title">💳 طريقة الدفع</div>
    <div class="payment-row">
      <button type="button" class="payment-option active" onclick="selectPayment('cash', this)">💵 نقدًا</button>
      <button type="button" class="payment-option" onclick="selectPayment('credit', this)">🧾 آجل</button>
    </div>
    <input type="hidden" id="paymentMethod" value="cash">
  </section>

  <!-- الأصناف -->
  <section class="section">
    <div class="section-title">📦 أصناف الفاتورة</div>

    <!-- حقل البحث والقائمة الخاصة بالمخزون -->
    <div class="field" style="margin-bottom: 8px;">
      <label>بحث عن صنف</label>
      <input id="itemSearch" type="text" list="invoiceItemsList" placeholder="اكتب اسم الصنف أو الباركود..." autocomplete="off">
      <datalist id="invoiceItemsList"></datalist>
    </div>

    <div class="items-header">
      <div>الصنف</div>
      <div>الكمية</div>
      <div>السعر</div>
      <div>الإجمالي</div>
      <div></div>
    </div>

    <div id="itemsBody"></div>

    <button type="button" class="add-item" onclick="addItem()">
      ＋ إضافة صنف إلى الفاتورة
    </button>
  </section>

  <!-- الخصم والضريبة -->
  <section class="section">
    <div class="section-title">🧮 الخصم والضريبة</div>
    <div class="summary">
      <div class="summary-box">
        <label>الخصم</label>
        <input id="discount" type="number" value="0" min="0" oninput="calculateTotals()">
      </div>
      <div class="summary-box">
        <label>الضريبة</label>
        <input id="tax" type="number" value="0" min="0" oninput="calculateTotals()">
      </div>
    </div>
    <div class="total-box">
      <span>صافي الفاتورة</span>
      <strong id="grandTotal">0.00</strong>
    </div>
  </section>

  <!-- البيان -->
  <section class="section">
    <div class="section-title">📝 البيان والملاحظات</div>
    <div class="field">
      <textarea id="notes" rows="3" placeholder="اكتب ملاحظات الفاتورة هنا..."></textarea>
    </div>
  </section>

</main>

<div class="bottom-actions">
  <button class="action-btn save" type="button" onclick="saveInvoice(false)">💾 حفظ الفاتورة</button>
  <button class="action-btn print" type="button" onclick="saveAndPrint()">🖨 حفظ وطباعة</button>
  <button class="action-btn new" type="button" onclick="newInvoice()">＋ حفظ و جديد</button>
</div>

<script>
'use strict';

const INVOICE_KEY = 'hisabak_invoices';
let invoiceItems = [];
let invoiceType = 'sale';

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return Number(value || 0).toFixed(2);
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function setInvoiceType(type) {
  invoiceType = type;
  if ($('invoiceType'))$('invoiceType').value = type;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
    if (tab.getAttribute('data-type') === type) {
      tab.classList.add('active');
    }
  });

  const title = $('invoiceTitle');
  if (title) {
    const titles = {
      sale: 'فاتورة مبيعات',
      purchase: 'فاتورة مشتريات',
      sales_return: 'مرتجع مبيعات',
      purchase_return: 'مرتجع مشتريات'
    };
    title.textContent = titles[type] || 'فاتورة';
  }
}

function selectPayment(method, btn) {
  document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  if ($('paymentMethod'))$('paymentMethod').value = method;
}

function addParty() {
  alert('ميزة إضافة عميل/مورد جديد');
}

/* تحميل وربط الأصناف من المخزون */
document.addEventListener('DOMContentLoaded', function () {
  if ($('invoiceDate'))$('invoiceDate').value = today();
  if ($('invoiceNo'))$('invoiceNo').value = 'INV-' + Date.now();

  loadStockList();
  renderItems();
  calculateTotals();
});

function loadStockList() {
  const list = $('invoiceItemsList');
  if (!list) return;

  let stockItems = [];
  try {
    stockItems = JSON.parse(localStorage.getItem('hisabak_items_master') || '[]');
  } catch (e) {
    stockItems = [];
  }

  list.innerHTML = '';
  stockItems.forEach(function (item) {
    if (item.name) {
      const option = document.createElement('option');
      option.value = item.name;
      list.appendChild(option);
    }
    if (item.barcode) {
      const option = document.createElement('option');
      option.value = item.barcode;
      list.appendChild(option);
    }
  });
}

function addItem() {
  const search = $('itemSearch');
  if (!search) return;

  const value = search.value.trim();
  if (!value) {
    showNotice('اكتب اسم الصنف أو الباركود أولاً', 'error');
    return;
  }

  let stockItems = [];
  try {
    stockItems = JSON.parse(localStorage.getItem('hisabak_items_master') || '[]');
  } catch (e) {
    stockItems = [];
  }

  const found = stockItems.find(function (item) {
    return String(item.name || '').trim().toLowerCase() === value.toLowerCase() ||
           String(item.barcode || '').trim() === value;
  });

  if (!found) {
    showNotice('الصنف غير موجود في المخزون', 'error');
    return;
  }

  // التحقق إذا كان الصنف مضافاً مسبقاً لزيادة الكمية بدلاً من تكراره
  const existing = invoiceItems.find(i => String(i.itemId) === String(found.id));
  if (existing) {
    existing.quantity += 1;
  } else {
    invoiceItems.push({
      id: Date.now() + Math.random(),
      itemId: found.id,
      name: found.name,
      quantity: 1,
      price: Number(found.price || 0)
    });
  }

  search.value = '';
  renderItems();
  calculateTotals();
  showNotice('تمت إضافة الصنف بنجاح', 'success');
}

function renderItems() {
  const body = $('itemsBody');
  if (!body) return;

  body.innerHTML = '';

  if (invoiceItems.length === 0) {
    body.innerHTML = `<div style="text-align:center; padding:15px; color:#888; font-size:12px;">لا توجد أصناف مضافة حالياً</div>`;
    return;
  }

  invoiceItems.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'item-row';

    row.innerHTML = `
      <div style="text-align:right; padding-right:4px; font-weight:600;">${item.name}</div>
      <div>
        <input type="number" min="1" value="${item.quantity}" oninput="changeItem(${item.id}, 'quantity', this.value)">
      </div>
      <div>
        <input type="number" min="0" step="any" value="${item.price}" oninput="changeItem(${item.id}, 'price', this.value)">
      </div>
      <div class="row-total" style="font-weight:bold; color:#1556c0;">${money(item.quantity * item.price)}</div>
      <div>
        <button class="delete-item" type="button" onclick="deleteItem(${item.id})">×</button>
      </div>
    `;

    body.appendChild(row);
  });
}

function changeItem(id, field, value) {
  const item = invoiceItems.find(i => Number(i.id) === Number(id));
  if (!item) return;

  item[field] = Number(value || 0);
  renderItems();
  calculateTotals();
}

function deleteItem(id) {
  invoiceItems = invoiceItems.filter(i => Number(i.id) !== Number(id));
  renderItems();
  calculateTotals();
}

function calculateTotals() {
  const subtotal = invoiceItems.reduce(
    (total, item) => total + (Number(item.quantity || 0) * Number(item.price || 0)),
    0
  );

  const discount = Number($('discount')?.value || 0);
  const tax = Number($('tax')?.value || 0);

  const afterDiscount = Math.max(subtotal - discount, 0);
  const grandTotal = afterDiscount + tax;

  if ($('grandTotal')) {$('grandTotal').textContent = money(grandTotal);
  }

  return {
    subtotal,
    discount,
    tax,
    grandTotal
  };
}

function getInvoiceData() {
  const totals = calculateTotals();

  return {
    id: 'inv_' + Date.now(),
    invoiceNo: $('invoiceNo')?.value || ('INV-' + Date.now()),
    date: $('invoiceDate')?.value || today(),
    type: invoiceType,
    customer: $('customer')?.value || '',
    paymentMethod: $('paymentMethod')?.value || 'cash',
    warehouse: $('warehouse')?.value || 'main',
    currency: $('currency')?.value || 'YER',
    items: invoiceItems.map(item => ({ ...item })),
    notes: $('notes')?.value || '',
    subtotal: totals.subtotal,
    discount: totals.discount,
    tax: totals.tax,
    grandTotal: totals.grandTotal,
    createdAt: new Date().toISOString()
  };
}

function saveInvoice(clearAfter = false) {
  const data = getInvoiceData();

  if (!data.items.length) {
    showNotice('أضف صنفًا واحدًا على الأقل', 'error');
    return;
  }

  let invoices = [];
  let stockItems = [];

  try {
    invoices = JSON.parse(localStorage.getItem(INVOICE_KEY) || '[]');
    stockItems = JSON.parse(
      localStorage.getItem('hisabak_items_master') || '[]'
    );
  } catch (e) {
    showNotice('تعذر قراءة بيانات الفواتير أو المخزون', 'error');
    return;
  }

  if (!Array.isArray(invoices) || !Array.isArray(stockItems)) {
    showNotice('بيانات الفواتير أو المخزون غير صحيحة', 'error');
    return;
  }

  // منع تكرار الفاتورة المحفوظة بالرقم نفسه
  const duplicate = invoices.some(inv =>
    String(inv.invoiceNo || inv.invoiceNumber || '') ===
    String(data.invoiceNo)
  );

  if (duplicate) {
    showNotice('رقم الفاتورة مستخدم مسبقًا، غيّر رقم الفاتورة أولًا', 'error');
    return;
  }

  // التحقق من وجود الأصناف وكفاية الرصيد قبل البيع
  if (invoiceType === 'sale') {
    for (const soldItem of data.items) {
      const stockItem = stockItems.find(
        item => String(item.id) === String(soldItem.itemId)
      );

      if (!stockItem) {
        showNotice('الصنف ' + soldItem.name + ' غير موجود في المخزون', 'error');
        return;
      }

      const available = Number(stockItem.stock || 0);
      const requested = Number(soldItem.quantity || 0);

      if (requested <= 0 || requested > available) {
        showNotice(
          'الرصيد غير كافٍ للصنف: ' + soldItem.name +
          '، المتوفر: ' + available,
          'error'
        );
        return;
      }
    }
  }

  // تسجيل الفاتورة
  data.paid = data.paymentMethod === 'cash' ? data.grandTotal : 0;
  data.remaining = Math.max(0, data.grandTotal - data.paid);
  data.total = data.grandTotal;

  // تحديد نوع الحركة على المخزون
  for (const invoiceItem of data.items) {
    const stockItem = stockItems.find(
      item => String(item.id) === String(invoiceItem.itemId)
    );

    if (!stockItem) continue;

    const quantity = Number(invoiceItem.quantity || 0);

    if (invoiceType === 'sale' || invoiceType === 'purchase_return') {
      stockItem.stock = Number(stockItem.stock || 0) - quantity;
    } else if (
      invoiceType === 'purchase' ||
      invoiceType === 'sales_return'
    ) {
      stockItem.stock = Number(stockItem.stock || 0) + quantity;
    }
  }

  try {
    localStorage.setItem('hisabak_items_master', JSON.stringify(stockItems));
    invoices.push(data);
    localStorage.setItem(INVOICE_KEY, JSON.stringify(invoices));
  } catch (e) {
    showNotice('تعذر حفظ البيانات على الجهاز', 'error');
    return;
  }

  showNotice('تم حفظ الفاتورة وتحديث المخزون بنجاح', 'success');

  if (clearAfter) {
    newInvoice();
  }
}
function saveAndPrint() {
  saveInvoice(false);
  setTimeout(() => {
    window.print();
  }, 300);
}

function newInvoice() {
  invoiceItems = [];
  if ($('invoiceNo'))$('invoiceNo').value = 'INV-' + Date.now();
  if ($('invoiceDate'))$('invoiceDate').value = today();
  if ($('customer'))$('customer').value = '';
  if ($('notes'))$('notes').value = '';
  if ($('discount'))$('discount').value = '0';
  if ($('tax'))$('tax').value = '0';
  if ($('itemSearch'))$('itemSearch').value = '';

  renderItems();
  calculateTotals();
}

function showNotice(message, type = 'success') {
  const old = document.querySelector('.hisabak-notice');
  if (old) old.remove();

  const notice = document.createElement('div');
  notice.className = 'hisabak-notice';
  notice.textContent = message;

  notice.style.cssText = `
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    padding:12px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    background:${type === 'error' ? '#fff0f0' : '#eaf7ee'};
    color:${type === 'error' ? '#c62828' : '#28743a'};
    border:1px solid ${type === 'error' ? '#f3caca' : '#ccebd5'};
  `;

  document.body.appendChild(notice);

  setTimeout(() => {
    notice.remove();
  }, 2200);
}
</script>

</body>
</html>
