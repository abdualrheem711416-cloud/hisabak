<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة المبيعات - المحاسب الاحترافي بلس</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

body{
  margin:0;
  background:#f5f7fa;
  color:#263238;
  padding-bottom:95px;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* الرأس */
.header{
  background:linear-gradient(135deg,#1556c0,#1976d2);
  color:#fff;
  padding:12px 14px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.back-btn{
  border:0;
  background:transparent;
  color:#fff;
  font-size:26px;
  width:42px;
}

.header-title{
  text-align:center;
  flex:1;
}

.header-title b{
  display:block;
  font-size:19px;
}

.header-title small{
  display:block;
  font-size:11px;
  opacity:.9;
  margin-top:3px;
}

.header-icon{
  font-size:25px;
  width:42px;
  text-align:center;
}

/* التبويبات */
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:#fff;
  padding:6px;
  margin:8px 10px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab{
  border:0;
  background:#f1f4f8;
  color:#54606b;
  padding:10px 3px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}

.tab.active{
  background:#1976d2;
  color:#fff;
}

/* المحتوى */
.container{
  padding:10px;
}

.section{
  background:#fff;
  border:1px solid #e1e7ee;
  border-radius:13px;
  margin-bottom:10px;
  padding:10px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  color:#1556c0;
  margin-bottom:9px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.field label{
  font-size:11px;
  color:#66727d;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d5dce4;
  border-radius:8px;
  padding:9px;
  background:#fff;
  font-size:13px;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#1976d2;
}

.full{
  grid-column:1 / -1;
}

/* بيانات العميل */
.account-box{
  display:flex;
  gap:7px;
}

.account-box select{
  flex:1;
}

.add-btn{
  width:42px;
  border:0;
  border-radius:8px;
  background:#e8f1ff;
  color:#1556c0;
  font-size:22px;
  font-weight:700;
}

/* طريقة الدفع */
.payment-row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.payment-option{
  border:1px solid #d5dce4;
  background:#fff;
  border-radius:9px;
  padding:9px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.payment-option.active{
  border-color:#1976d2;
  background:#eaf3ff;
  color:#1556c0;
}

/* جدول الأصناف */
.items-header{
  display:grid;
  grid-template-columns:2fr .8fr 1fr 1fr 36px;
  gap:4px;
  background:#1976d2;
  color:#fff;
  padding:9px 5px;
  border-radius:9px 9px 0 0;
  font-size:11px;
  font-weight:700;
  text-align:center;
}

.item-row{
  display:grid;
  grid-template-columns:2fr .8fr 1fr 1fr 36px;
  gap:4px;
  padding:7px 5px;
  border:1px solid #e5e9ee;
  border-top:0;
  background:#fff;
  font-size:11px;
  align-items:center;
}

.item-row input{
  width:100%;
  border:1px solid #d8dee5;
  border-radius:6px;
  padding:7px 3px;
  text-align:center;
}

.delete-item{
  border:0;
  background:#fff0f0;
  color:#d32f2f;
  border-radius:6px;
  height:30px;
}

/* إضافة صنف */
.add-item{
  margin-top:8px;
  width:100%;
  border:1px dashed #1976d2;
  background:#f4f8ff;
  color:#1556c0;
  border-radius:9px;
  padding:10px;
  font-weight:700;
}

/* الإجماليات */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.summary-box{
  border:1px solid #e1e6eb;
  border-radius:9px;
  padding:8px;
}

.summary-box label{
  display:block;
  font-size:11px;
  color:#697680;
  margin-bottom:4px;
}

.summary-box input{
  width:100%;
  border:0;
  outline:0;
  font-size:14px;
  font-weight:800;
  background:transparent;
}

.total-box{
  margin-top:8px;
  background:#eaf3ff;
  border:1px solid #c8ddfa;
  border-radius:10px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  font-weight:800;
  color:#1556c0;
}

.total-box strong{
  font-size:20px;
  color:#1556c0;
}

/* أزرار الحفظ */
.bottom-actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #dce3ea;
  padding:9px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  z-index:50;
}

.action-btn{
  border:0;
  border-radius:9px;
  padding:11px 5px;
  font-size:11px;
  font-weight:800;
}

.save{
  background:#1976d2;
  color:#fff;
}

.print{
  background:#e8f1ff;
  color:#1556c0;
}

.new{
  background:#edf7ef;
  color:#28743a;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">

    <button class="back-btn" onclick="history.back()">‹</button>

    <div class="header-title">
      <b>فاتورة المبيعات</b>
      <small>المحاسب الاحترافي بلس</small>
    </div>

    <div class="header-icon">🧾</div>

  </div>
</header>

<div class="tabs">

  <button class="tab active" onclick="setInvoiceType('sale',this)">
    فاتورة بيع
  </button>

  <button class="tab" onclick="setInvoiceType('purchase',this)">
    فاتورة شراء
  </button>

  <button class="tab" onclick="setInvoiceType('sales_return',this)">
    مرتجع بيع
  </button>

  <button class="tab" onclick="setInvoiceType('purchase_return',this)">
    مرتجع شراء
  </button>

</div>

<main class="container">

  <!-- معلومات الفاتورة -->
  <section class="section">

    <div class="section-title">
      📄 معلومات الفاتورة
    </div>

    <div class="grid-2">

      <div class="field">
        <label>رقم الفاتورة</label>
        <input id="invoiceNo" type="text" value="1001">
      </div>

      <div class="field">
        <label>التاريخ</label>
        <input id="invoiceDate" type="date">
      </div>

      <div class="field">
        <label>نوع الفاتورة</label>
        <select id="invoiceType">
          <option value="sale">بيع</option>
          <option value="purchase">شراء</option>
          <option value="sales_return">مرتجع بيع</option>
          <option value="purchase_return">مرتجع شراء</option>
        </select>
      </div>

      <div class="field">
        <label>المستودع</label>
        <select id="warehouse">
          <option value="main">المستودع الرئيسي</option>
        </select>
      </div>

    </div>

  </section>

  <!-- العميل / المورد -->
  <section class="section">

    <div class="section-title">
      👤 الطرف
    </div>

    <div class="grid-2">

      <div class="field full">
        <label id="partyLabel">العميل</label>

        <div class="account-box">

          <select id="party">
            <option value="">اختر العميل</option>
            <option value="cash">عميل نقدي</option>
          </select>

          <button class="add-btn" onclick="addParty()">+</button>

        </div>
      </div>

      <div class="field">
        <label>العملة</label>

        <select id="currency">
          <option value="YER">ريال يمني</option>
          <option value="SAR">ريال سعودي</option>
          <option value="USD">دولار</option>
        </select>
      </div>

      <div class="field">
        <label>سعر الصرف</label>
        <input id="exchangeRate" type="number" value="1">
      </div>

    </div>

  </section>

  <!-- طريقة الدفع -->
  <section class="section">

    <div class="section-title">
      💳 طريقة الدفع
    </div>

    <div class="payment-row">

      <button
        class="payment-option active"
        onclick="selectPayment('cash',this)"
      >
        💵 نقدًا
      </button>

      <button
        class="payment-option"
        onclick="selectPayment('credit',this)"
      >
        🧾 آجل
      </button>

    </div>

  </section>

  <!-- الأصناف -->
  <section class="section">

    <div class="section-title">
      📦 أصناف الفاتورة
    </div>

    <div class="items-header">
      <div>الصنف</div>
      <div>الكمية</div>
      <div>السعر</div>
      <div>الإجمالي</div>
      <div></div>
    </div>

    <div id="itemsBody">

      <div class="item-row">

        <input
          class="item-name"
          type="text"
          placeholder="اسم الصنف"
        >

        <input
          class="item-qty"
          type="number"
          value="1"
          min="1"
          oninput="calculateTotals()"
        >

        <input
          class="item-price"
          type="number"
          value="0"
          min="0"
          oninput="calculateTotals()"
        >

        <input
          class="item-total"
          type="number"
          value="0"
          readonly
        >

        <button
          class="delete-item"
          onclick="deleteItem(this)"
        >
          ×
        </button>

      </div>

    </div>

    <button class="add-item" onclick="addItem()">
      ＋ إضافة صنف إلى الفاتورة
    </button>

  </section>

  <!-- الخصم والضريبة -->
  <section class="section">

    <div class="section-title">
      🧮 الخصم والضريبة
    </div>

    <div class="summary">

      <div class="summary-box">
        <label>الخصم</label>
        <input
          id="discount"
          type="number"
          value="0"
          min="0"
          oninput="calculateTotals()"
        >
      </div>

      <div class="summary-box">
        <label>الضريبة</label>
        <input
          id="tax"
          type="number"
          value="0"
          min="0"
          oninput="calculateTotals()"
        >
      </div>

    </div>

    <div class="total-box">

      <span>صافي الفاتورة</span>

      <strong id="grandTotal">
        0.00
      </strong>

    </div>

  </section>

  <!-- البيان -->
  <section class="section">

    <div class="section-title">
      📝 البيان والملاحظات
    </div>

    <div class="field">

      <textarea
        id="notes"
        rows="3"
        placeholder="اكتب ملاحظات الفاتورة هنا..."
      ></textarea>

    </div>

  </section>

</main>

<div class="bottom-actions">

  <button
    class="action-btn save"
    onclick="saveInvoice()"
  >
    💾 حفظ الفاتورة
  </button>

  <button
    class="action-btn print"
    onclick="saveAndPrint()"
  >
    🖨 حفظ وطباعة
  </button>

  <button
    class="action-btn new"
    onclick="newInvoice()"
  >
    ＋ حفظ و جديد
  </button>

</div>
<script>
'use strict';

const INVOICE_KEY = 'hisabak_invoices';

let invoiceItems = [];
let invoiceType = 'sale';

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return Number(value || 0).toFixed(2);
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function setInvoiceType(type) {
  invoiceType = type;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  const active = document.querySelector(
    `.tab[data-type="${type}"]`
  );

  if (active) {
    active.classList.add('active');
  }

  const title = $('invoiceTitle');

  if (title) {
    const titles = {
      sale: 'فاتورة مبيعات',
      purchase: 'فاتورة مشتريات',
      salesReturn: 'مرتجع مبيعات',
      purchaseReturn: 'مرتجع مشتريات'
    };

    title.textContent = titles[type] || 'فاتورة';
  }
}

function addItem() {
  const items = JSON.parse(
    localStorage.getItem('hisabak_items_master') || '[]'
  );

  if (!items.length) {
    showNotice('لا توجد أصناف مسجلة في المخزون', 'error');
    return;
  }

  const search = prompt('🔎 ابحث باسم الصنف أو الباركود');

  if (!search || !search.trim()) return;

  const text = search.trim().toLowerCase();

  const matches = items.filter(item =>
    String(item.name || '').toLowerCase().includes(text) ||
    String(item.barcode || '').toLowerCase().includes(text)
  );

  if (!matches.length) {
    showNotice('لم يتم العثور على الصنف', 'error');
    return;
  }

  let selected;

  if (matches.length === 1) {
    selected = matches[0];
  } else {
    const exact = matches.find(item =>
      String(item.name || '').trim().toLowerCase() === text ||
      String(item.barcode || '').trim() === search.trim()
    );

    if (exact) {
      selected = exact;
    } else {
      const names = matches.map(item => item.name).join('، ');
      const name = prompt(
        'تم العثور على أكثر من صنف.\n\nاكتب اسم الصنف المطلوب:\n' + names
      );

      if (!name || !name.trim()) return;

      selected = matches.find(item =>
        String(item.name || '').toLowerCase() === name.trim().toLowerCase()
      );

      if (!selected) {
        showNotice('لم يتم اختيار صنف صحيح', 'error');
        return;
      }
    }
  }

  invoiceItems.push({
    id: Date.now(),
    name: selected.name,
    quantity: 1,
    price: Number(selected.price || 0),
    barcode: selected.barcode || ''
  });

  renderItems();
  calculateTotals();
}

function renderItems() {
  const body = $('itemsBody');

  if (!body) {
    return;
  }

  body.innerHTML = '';

  invoiceItems.forEach((item, index) => {
    const row = document.createElement('tr');

    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.name}</td>

      <td>
        <input
          class="qty"
          type="number"
          min="0"
          value="${item.quantity}"
          oninput="changeItem(${item.id}, 'quantity', this.value)"
        >
      </td>

      <td>
        <input
          class="price"
          type="number"
          min="0"
          value="${item.price}"
          oninput="changeItem(${item.id}, 'price', this.value)"
        >
      </td>

      <td>
        ${money(item.quantity * item.price)}
      </td>

      <td>
        <button
          class="delete"
          type="button"
          onclick="deleteItem(${item.id})"
        >
          حذف
        </button>
      </td>
    `;

    body.appendChild(row);
  });
}

function changeItem(id, field, value) {
  const item = invoiceItems.find(
    item => item.id === id
  );

  if (!item) {
    return;
  }

  item[field] = Number(value || 0);

  renderItems();
  calculateTotals();
}

function deleteItem(id) {
  invoiceItems = invoiceItems.filter(
    item => item.id !== id
  );

  renderItems();
  calculateTotals();
}

function calculateTotals() {
  const subtotal = invoiceItems.reduce(
    (total, item) =>
      total + (
        Number(item.quantity || 0) *
        Number(item.price || 0)
      ),
    0
  );

  const discount = Number(
    $('discount')?.value || 0
  );

  const tax = Number(
    $('tax')?.value || 0
  );

  const afterDiscount = Math.max(
    subtotal - discount,
    0
  );

  const grandTotal = afterDiscount + tax;

  if ($('subtotal')) {
    $('subtotal').textContent = money(subtotal);
  }

  if ($('grandTotal')) {
    $('grandTotal').textContent = money(grandTotal);
  }

  return {
    subtotal,
    discount,
    tax,
    grandTotal
  };
}

function getInvoiceData() {
  const totals = calculateTotals();

  return {
    id: 'inv_' + Date.now(),
    invoiceNo:
      $('invoiceNo')?.value ||
      ('INV-' + Date.now()),

    date:
      $('invoiceDate')?.value ||
      today(),

    type: invoiceType,

    customer:
      $('customer')?.value || '',

    paymentMethod:
      $('paymentMethod')?.value || '',

    warehouse:
      $('warehouse')?.value || '',

    currency:
      $('currency')?.value || '',

    items: invoiceItems.map(item => ({
      ...item
    })),

    notes:
      $('notes')?.value || '',

    subtotal: totals.subtotal,
    discount: totals.discount,
    tax: totals.tax,
    grandTotal: totals.grandTotal,

    createdAt: new Date().toISOString()
  };
}

function saveInvoice(clearAfter = false) {
  const data = getInvoiceData();

  if (!data.items.length) {
    showNotice(
      'أضف صنفًا واحدًا على الأقل',
      'error'
    );
    return;
  }

  const invoices = JSON.parse(
    localStorage.getItem(INVOICE_KEY) || '[]'
  );

  invoices.push(data);

  localStorage.setItem(
    INVOICE_KEY,
    JSON.stringify(invoices)
  );

  showNotice(
    'تم حفظ الفاتورة بنجاح',
    'success'
  );

  if (clearAfter) {
    newInvoice();
  }
}

function saveAndPrint() {
  saveInvoice(false);

  setTimeout(() => {
    window.print();
  }, 300);
}

function newInvoice() {
  invoiceItems = [];

  if ($('invoiceNo')) {
    $('invoiceNo').value =
      'INV-' + Date.now();
  }

  if ($('invoiceDate')) {
    $('invoiceDate').value = today();
  }

  if ($('customer')) {
    $('customer').value = '';
  }

  if ($('notes')) {
    $('notes').value = '';
  }

  if ($('discount')) {
    $('discount').value = '0';
  }

  if ($('tax')) {
    $('tax').value = '0';
  }

  renderItems();
  calculateTotals();
}

function showNotice(message, type = 'success') {
  const old = document.querySelector(
    '.hisabak-notice'
  );

  if (old) {
    old.remove();
  }

  const notice = document.createElement('div');

  notice.className =
    'hisabak-notice';

  notice.textContent = message;

  notice.style.cssText = `
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    padding:12px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    background:${
      type === 'error'
        ? '#fff0f0'
        : '#eaf7ee'
    };
    color:${
      type === 'error'
        ? '#c62828'
        : '#28743a'
    };
    border:1px solid ${
      type === 'error'
        ? '#f3caca'
        : '#ccebd5'
    };
  `;

  document.body.appendChild(notice);

  setTimeout(() => {
    notice.remove();
  }, 2200);
}

document.addEventListener(
  'DOMContentLoaded',
  () => {
    if ($('invoiceDate')) {
      $('invoiceDate').value = today();
    }

    if ($('invoiceNo')) {
      $('invoiceNo').value =
        'INV-' + Date.now();
    }

    renderItems();
    calculateTotals();

    const firstTab =
      document.querySelector('.tab');

    if (firstTab) {
      firstTab.classList.add('active');
    }
  }
);
</script>

</body>
</html>
