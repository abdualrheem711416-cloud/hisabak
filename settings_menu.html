<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الإعدادات - حسابك</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f9; color: #1e293b; padding-bottom: 30px; }
    .top-bar {
      background-color: #0b5cab;
      color: white;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(11, 92, 171, 0.2);
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }
    .menu-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }
    .menu-item {
      background: white;
      border-radius: 12px;
      border: 1px solid #dbe4ee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      text-decoration: none;
      color: #1e293b;
      box-shadow: 0 2px 4px rgba(11, 92, 171, 0.03);
    }
    .item-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    /* الدائرة الزرقاء مع الدولار الذهبي */
    .blue-circle-dollar {
      width: 42px;
      height: 42px;
      min-width: 42px;
      background-color: #0b5cab;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(11, 92, 171, 0.35);
    }
    .blue-circle-dollar span {
      color: #ffd700;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      font-family: Arial, sans-serif;
    }
    .item-title {
      font-size: 16px;
      font-weight: bold;
      color: #0b5cab;
    }
    .arrow {
      color: #94a3b8;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <h2 style="font-size: 18px; font-weight: bold;">الإعدادات</h2>
  </div>

  <div class="menu-container">
    <!-- بند العملات بالأيقونة المحددة -->
    <a href="currencies.html" class="menu-item">
      <div class="item-right">
        <div class="blue-circle-dollar">
          <span>$</span>
        </div>
        <span class="item-title">العملات</span>
      </div>
      <span class="arrow">◀</span>
    </a>
  </div>
</body>
</html>
