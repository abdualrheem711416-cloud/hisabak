<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الإعدادات - حسابك</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6fa; color: #333; }
    .top-bar { background-color: #0b5cab; color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; font-size: 16px; font-weight: bold; }
    .back-btn { color: white; text-decoration: none; font-size: 22px; }
    .menu-container { padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
    .menu-card { background: white; border: 1px solid #d0e0f5; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #222; box-shadow: 0 2px 5px rgba(0,0,0,0.03); transition: background 0.2s; cursor: pointer; }
    .menu-card:active { background: #eaf2fb; }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .card-icon { width: 40px; height: 40px; border-radius: 8px; background: #eaf2fb; color: #0b5cab; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .card-title { font-size: 15px; font-weight: bold; }
    .card-subtitle { font-size: 12px; color: #777; margin-top: 2px; }
    .arrow { color: #999; font-size: 18px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">&#10005;</a>
    <span>لوحة الإعدادات</span>
    <span style="width:22px;"></span>
  </div>

  <div class="menu-container">
    <!-- قسم الإعدادات العامة -->
    <a href="settings.html" class="menu-card">
      <div class="card-left">
        <div class="card-icon">⚙️</div>
        <div>
          <div class="card-title">الإعدادات العامة</div>
          <div class="card-subtitle">بيانات المنشأة، الفواتير، الحسابات، والطباعة</div>
        </div>
      </div>
      <div class="arrow">&#10095;</div>
    </a>

    <!-- أقسام مستقبلية جاهزة -->
    <div class="menu-card" style="opacity: 0.85;" onclick="alert('قريباً: إدارة المستخدمين والصلاحيات')">
      <div class="card-left">
        <div class="card-icon" style="background:#e8f5e9; color:#2e7d32;">👥</div>
        <div>
          <div class="card-title">إدارة المستخدمين والفروع</div>
          <div class="card-subtitle">صلاحيات البيع، مدراء النظام والمزامنة</div>
        </div>
      </div>
      <div class="arrow">&#10095;</div>
    </div>

    <div class="menu-card" style="opacity: 0.85;" onclick="alert('قريباً: إدارة النسخ الاحتياطي')">
      <div class="card-left">
        <div class="card-icon" style="background:#fff3e0; color:#e65100;">💾</div>
        <div>
          <div class="card-title">النسخ الاحتياطي والاستعادة</div>
          <div class="card-subtitle">تصدير واستيراد البيانات محلياً أو سحابياً</div>
        </div>
      </div>
      <div class="arrow">&#10095;</div>
    </div>

    <div class="menu-card" style="opacity: 0.85;" onclick="alert('قريباً: إعدادات الطابعات الحرارية')">
      <div class="card-left">
        <div class="card-icon" style="background:#ede7f6; color:#512da8;">🖨️</div>
        <div>
          <div class="card-title">إعدادات الطابعات الحرارية</div>
          <div class="card-subtitle">الربط مع طابعات البلوتوث والشبكة (ESC/POS)</div>
        </div>
      </div>
      <div class="arrow">&#10095;</div>
    </div>
  </div>

</body>
</html>
